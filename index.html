<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: linear-gradient(180deg, #fdeaee 0%, #f1efee 38%, #ffe9d8 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  /* Effet Liquid Glass */
  .glass-card {
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }

  .glass-dock {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(25px) saturate(200%);
    -webkit-backdrop-filter: blur(25px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 30px 60px rgba(244, 164, 184, 0.28), 0 10px 25px rgba(87, 83, 78, 0.10), inset 0 1px 2px rgba(255, 255, 255, 0.9);
  }

  .liquid-pill {
    background: linear-gradient(135deg, rgba(194, 65, 12, 0.94) 0%, rgba(234, 88, 12, 0.9) 55%, rgba(251, 146, 60, 0.88) 100%);
    box-shadow: 0 8px 20px rgba(234, 88, 12, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Animations de survol */
  .hover-scale {
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  }
  .hover-scale:hover {
    transform: translateY(-4px) scale(1.04);
  }

  /* Cartes : survol plus doux (léger soulèvement + ombre orangée, sans gros zoom) */
  .glass-card.hover-scale { transition: transform 0.3s ease, box-shadow 0.3s ease; }
  .glass-card.hover-scale:hover { transform: translateY(-4px); box-shadow: 0 26px 55px rgba(244, 164, 184, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.8); }
  /* Rythme de teintes dans les grilles de cartes : neutre, rose pastel, pêche, gris */
  .glass-card.hover-scale:nth-child(4n+2) { background: linear-gradient(135deg, rgba(251, 208, 219, 0.42), rgba(255, 255, 255, 0.45)); }
  .glass-card.hover-scale:nth-child(4n+3) { background: linear-gradient(135deg, rgba(253, 186, 116, 0.28), rgba(255, 255, 255, 0.45)); }
  .glass-card.hover-scale:nth-child(4n+4) { background: linear-gradient(135deg, rgba(168, 162, 158, 0.20), rgba(255, 255, 255, 0.45)); }
  /* Boutons et liens : changements de couleur en douceur */
  button, a { transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, opacity 0.25s ease; }

  /* Départ vers une autre rubrique (ex. bouton « Nous contacter ») : la page s'efface en douceur */
  .page-leave { opacity: 0; transform: translateY(-14px) scale(0.99); pointer-events: none; transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

  /* Fondu rapide quand on change de rubrique */

  /* Messagerie (Contact) : liste déroulante des sujets, ouverture fluide */
  .cge-dd { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 30; display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(-8px) scale(0.98); transform-origin: top center; visibility: hidden; pointer-events: none;
    transition: grid-template-rows 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 0.38s; }
  .cge-dd.is-open { grid-template-rows: 1fr; opacity: 1; transform: none; visibility: visible; pointer-events: auto; transition-delay: 0s; }
  .cge-dd-inner { overflow: hidden; min-height: 0; border-radius: 1rem; background: rgba(255,255,255,0.97); border: 1px solid rgba(251, 146, 60, 0.35); box-shadow: 0 18px 40px rgba(234, 88, 12, 0.18), 0 6px 14px rgba(87, 83, 78, 0.10); }
  .cge-dd li { opacity: 0; transform: translateY(-6px); transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.2s ease; }
  .cge-dd.is-open li { opacity: 1; transform: none; transition-delay: calc(var(--i, 0) * 45ms + 60ms), calc(var(--i, 0) * 45ms + 60ms), 0s; }
  .cge-msg-body { overflow: hidden; }
  @keyframes tabFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tab-fade { animation: tabFade 0.3s ease-out; }

  /* Albums (grille en colonnes) : Safari mobile perdait des cartes (invisibles mais cliquables) avec backdrop-filter / transform dans les colonnes */
  .album-card { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255, 255, 255, 0.78); -webkit-transform: translateZ(0); transform: translateZ(0); opacity: 1 !important; }
  .album-card.reveal, .album-card.reveal.is-visible { opacity: 1 !important; transform: translateZ(0); }

  /* Apparition douce des cartes au défilement */
  .reveal { opacity: 0; transform: translateY(18px); }
  .glass-card.reveal { transition: opacity 0.55s ease-out, transform 0.55s ease-out; transition-delay: var(--reveal-delay, 0ms); }
  .reveal.is-visible { opacity: 1; transform: none; }

  /* Dessins maritimes de « Ce que fait la CGE » : petit mouvement au survol */
  .art-spin { transform-origin: 100px 70px; transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .glass-card:hover .art-spin { transform: rotate(90deg); }
  .art-beam { opacity: 0.55; transition: opacity 0.6s ease; }
  .glass-card:hover .art-beam { opacity: 1; }

  /* Fanion du bateau de l'accueil : annonce la prochaine échéance (actualité, événement, formation) */
  @keyframes flagWave { from { transform: skewY(-0.8deg); } to { transform: skewY(0.8deg); } }
  @keyframes flagIn { from { opacity: 0; } to { opacity: 1; } }
  .flag-wave { transform-origin: 56px -20px; animation: flagWave 4.5s ease-in-out infinite alternate; }
  .flag-txt { animation: flagIn 0.6s ease-out; }
  @keyframes flagScroll { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--flag-shift, 0px)); } }
  .flag-scroll { animation: flagScroll var(--flag-dur, 6s) ease-in-out infinite alternate; }

  /* Vague très lente sous le titre de l'accueil */
  .wave-layer { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; overflow: hidden; pointer-events: none; z-index: 0; }
  .wave-layer svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; }
  @keyframes waveSlide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .wave-a { animation: waveSlide 18s linear infinite; }
  .wave-b { animation: waveSlide 28s linear infinite reverse; }

  /* Rose des vents du fond : rotation lente et continue (un tour en 100 s) */
  @keyframes compassSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .compass-spin { transform-origin: 0 0; animation: compassSpin 100s linear infinite; will-change: transform; }

  /* Le bateau de l'accueil tangue très légèrement (la mer, elle, ne bouge pas) */
  @keyframes shipBob {
    from { transform: rotate(-0.5deg) translateY(0.5px); }
    to   { transform: rotate(0.5deg) translateY(-1px); }
  }
  .ship-bob { transform-origin: 270px 176px; animation: shipBob 7s ease-in-out infinite alternate; }

  /* Accueil PC : léger effet de profondeur à la souris (soleil au loin, bateau au premier plan) + arrivée du bateau */
  .hero-scene { --px: 0; --py: 0; }
  .hero-par-sun { transform: translate3d(calc(var(--px) * -18px), calc(var(--py) * -12px), 0); transition: transform 0.4s ease-out; will-change: transform; }
  .hero-par-boat { transform: translate3d(calc(var(--px) * 26px), calc(var(--py) * 12px), 0); transition: transform 0.4s ease-out; will-change: transform; }
  @keyframes shipArrive { 0% { transform: translateX(75%); opacity: 0; } 14% { opacity: 1; } 100% { transform: translateX(0); opacity: 1; } }
  .hero-arrive { animation: shipArrive 2.6s cubic-bezier(0.22, 0.7, 0.25, 1) both; }
  @media (prefers-reduced-motion: reduce) {
    .hero-par-sun, .hero-par-boat { transform: none; transition: none; }
    .hero-arrive { animation: none; }
  }

  /* Fenêtres (connexion, formulaires, confirmations) : ouverture en fondu avec léger zoom */
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: none; } }
  .fixed.inset-0.z-50 { animation: overlayIn 0.2s ease-out; }
  .fixed.inset-0.z-50 > .glass-card, .fixed.inset-0.z-50 > [role="dialog"], .fixed.inset-0.z-50 > [role="alertdialog"] { animation: modalIn 0.25s ease-out; }

  /* Route maritime du fond : les pointillés avancent doucement, la balise pulse */
  @keyframes routeFlow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -12; } }
  .route-flow { animation: routeFlow 2.4s linear infinite; }
  @keyframes routePulse { 0% { transform: scale(1); opacity: 0.45; } 100% { transform: scale(3.2); opacity: 0; } }
  .route-pulse { transform-box: fill-box; transform-origin: center; animation: routePulse 3.2s ease-out infinite; }

  /* Écran de chargement : visible tant que le site démarre */
  #splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; font-family: Inter, system-ui, sans-serif; }
  #splash img { width: 84px; height: auto; animation: splashPulse 2.4s ease-in-out infinite; }
  #splash .splash-title { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 1.7rem; color: #1c1917; letter-spacing: 0.02em; }
  #splash .splash-bar { width: min(220px, 60vw); height: 4px; border-radius: 999px; background: rgba(244, 164, 184, 0.35); overflow: hidden; }
  #splash .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #EA580C, #F2A4B8); animation: splashSlide 1.3s ease-in-out infinite; }
  #splash .splash-note { margin: 0; font-size: 0.8rem; color: #78716c; }
  #splash-slow { margin: 0; max-width: 20rem; font-size: 0.75rem; color: #78716c; opacity: 0; transition: opacity 0.6s ease; }
  @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
  @keyframes splashSlide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  /* Barre du bas : défilement horizontal sans barre visible */
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Contour visible au clavier (accessibilité) */
  button:focus-visible, a:focus-visible, [role="button"]:focus-visible { outline: 3px solid #EA580C; outline-offset: 2px; }

  /* Respect du réglage « réduire les animations » du téléphone / ordinateur */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    .hover-scale:hover, .glass-card.hover-scale:hover { transform: none; }
    .tab-fade, .wave-a, .wave-b, .compass-spin, .ship-bob, .route-flow, .route-pulse, .flag-wave, .flag-txt, .flag-scroll { animation: none; }
    #splash img { animation: none; }
    #splash .splash-bar span { animation: none; width: 100%; opacity: 0.5; }
    .fixed.inset-0.z-50, .fixed.inset-0.z-50 > .glass-card, .fixed.inset-0.z-50 > [role="dialog"], .fixed.inset-0.z-50 > [role="alertdialog"] { animation: none; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
