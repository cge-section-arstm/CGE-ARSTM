function App() {
  const [activeTab, setActiveTab] = useState('accueil');
  const [hoveredTab, setHoveredTab] = useState(null);
  const [toast, setToast] = useState(null);

  // Auth States
  const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [showMemberModal, setShowMemberModal] = useState(false);
  const [memberMatriculeInput, setMemberMatriculeInput] = useState('');
  const [memberPinInput, setMemberPinInput] = useState('');
  const [failedAttempts, setFailedAttempts] = useState(0);
  const [isLocked, setIsLocked] = useState(false);
  const [isCheckingLogin, setIsCheckingLogin] = useState(false);

  // Gestion admin des membres du bureau
  const [showAddMemberModal, setShowAddMemberModal] = useState(false);
  const [editingMemberId, setEditingMemberId] = useState(null);
  const [memberToDelete, setMemberToDelete] = useState(null);
  const [newMemberForm, setNewMemberForm] = useState({ name: '', role: '', matricule: '', bio: '', pin: '', image: '' });
  const [isSavingMember, setIsSavingMember] = useState(false);

  // Espace Admin / Gestion des membres inscrits
  const [adminSearchQuery, setAdminSearchQuery] = useState('');
  const [resetModalMember, setResetModalMember] = useState(null);
  const [newPinResetInput, setNewPinResetInput] = useState('');
  const [isResettingPin, setIsResettingPin] = useState(false);

  // Gestion admin générique
  const [resourceModal, setResourceModal] = useState({ type: null, editingId: null });
  const [resourceForm, setResourceForm] = useState({});
  const [isSavingResource, setIsSavingResource] = useState(false);
  const [resourceToDelete, setResourceToDelete] = useState(null);

  // Navigation Ref
  const navRef = useRef(null);
  const [pillStyle, setPillStyle] = useState({ left: 0, width: 0, opacity: 0 });

  // Data Stores
  const [members, setMembers] = useState(initialMembers);
  const [news, setNews] = useState(initialNews);
  const [jobs, setJobs] = useState(initialJobs);
  const [alumni, setAlumni] = useState(initialAlumni);
  const [gallery, setGallery] = useState(initialGallery);
  const [events, setEvents] = useState(initialEvents);
  const [registry, setRegistry] = useState(initialRegistry);
  const [isSyncing, setIsSyncing] = useState(false);
  const [supabaseReady, setSupabaseReady] = useState(false);

  const mapMemberRow = (row) => ({ id: row.id, matricule: row.matricule, pinHash: row.pin_hash, name: row.name, role: row.role, bio: row.bio, image: row.image });
  const mapRegistryRow = (row) => ({ id: row.id, matricule: row.matricule, pinHash: row.pin_hash, name: row.name, role: row.role });

  const RESOURCE_STATE = { jobs: [jobs, setJobs, initialJobs], events: [events, setEvents, initialEvents], alumni: [alumni, setAlumni, initialAlumni], gallery: [gallery, setGallery, initialGallery] };

  useEffect(() => {
    if (!supabaseClient) return;
    (async () => {
      setIsSyncing(true);
      try {
        const { data: memberRows, error: mErr } = await supabaseClient.from('bureau_members').select('*').order('id');
        if (!mErr && memberRows) {
          setSupabaseReady(true);
          setMembers(memberRows.map(mapMemberRow));
        }
        const { data: regRows, error: rErr } = await supabaseClient.from('member_registry').select('*').order('id');
        if (!rErr && regRows) {
          setRegistry(regRows.map(mapRegistryRow));
        }
        for (const type of Object.keys(RESOURCE_CONFIGS)) {
          const { table } = RESOURCE_CONFIGS[type];
          const { data: rows, error } = await supabaseClient.from(table).select('*').order('id');
          if (!error && rows) {
            const setter = RESOURCE_STATE[type][1];
            setter(rows);
          }
        }
      } catch (e) {
        console.error('Supabase sync error:', e);
      } finally {
        setIsSyncing(false);
      }
    })();
  }, []);

  const isUserAuthenticated = currentUser !== null || isAdminLoggedIn;

  const baseNavItems = [
    { id: 'accueil', label: 'Accueil', icon: Home },
    { id: 'bureau', label: 'Membres', icon: Users },
    { id: 'emplois', label: 'Emplois & Stages', icon: Briefcase, protected: true },
    { id: 'activites', label: 'Activités', icon: Calendar },
    { id: 'alumni', label: 'Alumni', icon: GraduationCap },
    { id: 'mediatheque', label: 'Médiathèque', icon: Image },
    { id: 'admin-space', label: 'Gestion Admin', icon: ShieldCheck, adminOnly: true },
    { id: 'contact', label: 'Contact', icon: Mail },
  ];

  const navItems = baseNavItems.filter(item => {
    if (item.adminOnly) return isAdminLoggedIn;
    if (item.protected) return isUserAuthenticated;
    return true;
  });

  const showToastMsg = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3500);
  };

  useEffect(() => {
    const targetId = hoveredTab || activeTab;
    if (!navRef.current) return;
    const targetEl = navRef.current.querySelector(`[data-tab="${targetId}"]`);
    if (targetEl) {
      setPillStyle({
        left: targetEl.offsetLeft,
        width: targetEl.offsetWidth,
        opacity: 1
      });
    } else {
      setPillStyle(prev => ({ ...prev, opacity: 0 }));
    }
  }, [activeTab, hoveredTab, isUserAuthenticated, isAdminLoggedIn]);

  const closeMemberModal = () => {
    setShowMemberModal(false);
    setMemberMatriculeInput('');
    setMemberPinInput('');
  };

  const handleMemberLogin = async () => {
    if (isLocked) return;
    const id = memberMatriculeInput.trim();
    const secret = memberPinInput.trim();
    if (!id || !secret) {
      showToastMsg("Veuillez renseigner l'identifiant et le code.");
      return;
    }

    setIsCheckingLogin(true);
    try {
      const admin = ADMIN_ACCOUNTS.find(a => a.login.toLowerCase() === id.toLowerCase());
      if (admin) {
        const h = await hashSecret(admin.login, secret);
        if (h === admin.hash) {
          setIsAdminLoggedIn(true);
          setCurrentUser({ name: admin.name });
          setFailedAttempts(0);
          setIsLocked(false);
          closeMemberModal();
          showToastMsg(`Bienvenue, ${admin.name}`);
          return;
        }
      } else {
        const member = members.find(m => m.matricule.toLowerCase() === id.toLowerCase());
        if (member) {
          const h = await hashSecret(member.matricule, secret);
          if (h === member.pinHash) {
            setIsAdminLoggedIn(false);
            setCurrentUser(member);
            setFailedAttempts(0);
            setIsLocked(false);
            closeMemberModal();
            showToastMsg(`Bienvenue, ${member.name.split(' ')[0]}`);
            return;
          }
        } else {
          const registrant = registry.find(r => r.matricule.toLowerCase() === id.toLowerCase());
          if (registrant) {
            if (!registrant.pinHash) {
              const h = await hashSecret(registrant.matricule, secret);
              const activated = { ...registrant, pinHash: h };
              setRegistry(prev => prev.map(r => r.id === registrant.id ? activated : r));
              if (supabaseClient) {
                await supabaseClient.from('member_registry').update({ pin_hash: h }).eq('id', registrant.id);
              }
              setIsAdminLoggedIn(false);
              setCurrentUser(activated);
              setFailedAttempts(0);
              setIsLocked(false);
              closeMemberModal();
              showToastMsg(getWelcomeMessage(activated.matricule, activated.name, "Compte activé. Bienvenue"));
              return;
            }
            const h = await hashSecret(registrant.matricule, secret);
            if (h === registrant.pinHash) {
              setIsAdminLoggedIn(false);
              setCurrentUser(registrant);
              setFailedAttempts(0);
              setIsLocked(false);
              closeMemberModal();
              showToastMsg(getWelcomeMessage(registrant.matricule, registrant.name));
              return;
            }
          }
        }
      }

      const attempts = failedAttempts + 1;
      setFailedAttempts(attempts);
      const remaining = MAX_LOGIN_ATTEMPTS - attempts;
      if (remaining <= 0) {
        setIsLocked(true);
        showToastMsg("Compte verrouillé après 5 tentatives. Veuillez vous rapprocher du bureau informatique pour réinitialiser votre compte.");
      } else {
        showToastMsg(`Identifiant ou code incorrect. Il vous reste ${remaining} tentative${remaining > 1 ? 's' : ''}.`);
      }
    } finally {
      setIsCheckingLogin(false);
    }
  };

  const handleLogout = () => {
    setCurrentUser(null);
    setIsAdminLoggedIn(false);
    setActiveTab('accueil');
    showToastMsg("Déconnexion réussie.");
  };

  // --- Réinitialisation de mot de passe par l'administrateur ---
  const handleAdminResetPin = async () => {
    if (!resetModalMember) return;
    const newPin = newPinResetInput.trim();
    if (!newPin) {
      showToastMsg("Veuillez saisir un nouveau code PIN / mot de passe.");
      return;
    }

    setIsResettingPin(true);
    try {
      const pinHash = await hashSecret(resetModalMember.matricule, newPin);
      
      // Mise à jour si c'est un membre du bureau
      const isBureauMember = members.some(m => m.id === resetModalMember.id && m.matricule === resetModalMember.matricule);
      
      if (isBureauMember) {
        setMembers(prev => prev.map(m => m.id === resetModalMember.id ? { ...m, pinHash } : m));
        if (supabaseClient) {
          await supabaseClient.from('bureau_members').update({ pin_hash: pinHash }).eq('id', resetModalMember.id);
        }
      } else {
        setRegistry(prev => prev.map(r => r.id === resetModalMember.id ? { ...r, pinHash } : r));
        if (supabaseClient) {
          await supabaseClient.from('member_registry').update({ pin_hash: pinHash }).eq('id', resetModalMember.id);
        }
      }

      // Si le compte était verrouillé
      if (isLocked) setIsLocked(false);

      showToastMsg(`Mot de passe réinitialisé pour ${resetModalMember.name}.`);
      setResetModalMember(null);
      setNewPinResetInput('');
    } catch (err) {
      showToastMsg("Erreur lors de la réinitialisation : " + err.message);
    } finally {
      setIsResettingPin(false);
    }
  };

  const closeAddMemberModal = () => {
    setShowAddMemberModal(false);
    setEditingMemberId(null);
    setNewMemberForm({ name: '', role: '', matricule: '', bio: '', pin: '', image: '' });
  };

  const openAddMemberModal = () => {
    setEditingMemberId(null);
    setNewMemberForm({ name: '', role: '', matricule: '', bio: '', pin: '', image: '' });
    setShowAddMemberModal(true);
  };

  const openEditMemberModal = (m) => {
    setEditingMemberId(m.id);
    setNewMemberForm({ name: m.name, role: m.role, matricule: m.matricule, bio: m.bio || '', pin: '', image: m.image || '' });
    setShowAddMemberModal(true);
  };

  const handleMemberPhotoUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setNewMemberForm(f => ({ ...f, image: reader.result }));
    reader.readAsDataURL(file);
  };

  const handleSaveMember = async () => {
    const { name, role, matricule, bio, pin, image } = newMemberForm;
    const isEditing = editingMemberId !== null;

    if (!name.trim() || !role.trim() || !matricule.trim() || (!isEditing && !pin.trim())) {
      showToastMsg(isEditing ? "Nom, rôle et matricule sont obligatoires." : "Nom, rôle, matricule et code PIN sont obligatoires.");
      return;
    }
    if (members.some(m => m.matricule.toLowerCase() === matricule.trim().toLowerCase() && m.id !== editingMemberId)) {
      showToastMsg("Ce matricule est déjà utilisé par un autre membre.");
      return;
    }

    setIsSavingMember(true);
    try {
      if (isEditing) {
        const memberData = {
          matricule: matricule.trim(),
          name: name.trim(),
          role: role.trim(),
          bio: bio.trim() || "Membre du bureau exécutif de la CGE ARSTM.",
          image: image || "https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&q=80&w=400"
        };
        let newPinHash = null;
        if (pin.trim()) {
          newPinHash = await hashSecret(matricule.trim(), pin.trim());
          memberData.pin_hash = newPinHash;
        }

        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('bureau_members').update(memberData).eq('id', editingMemberId).select().single();
          if (error) {
            showToastMsg("Impossible de modifier ce membre sur le serveur : " + error.message);
            return;
          }
          setMembers(prev => prev.map(m => m.id === editingMemberId ? mapMemberRow(data) : m));
        } else {
          setMembers(prev => prev.map(m => m.id === editingMemberId ? { ...m, ...memberData, pinHash: newPinHash || m.pinHash } : m));
        }
        setCurrentUser(prev => (prev && prev.id === editingMemberId && !isAdminLoggedIn) ? { ...prev, ...memberData, pinHash: newPinHash || prev.pinHash } : prev);
        closeAddMemberModal();
        showToastMsg(`${memberData.name} a été modifié(e) avec succès.`);
      } else {
        const pinHash = await hashSecret(matricule.trim(), pin.trim());
        const memberData = {
          matricule: matricule.trim(),
          pin_hash: pinHash,
          name: name.trim(),
          role: role.trim(),
          bio: bio.trim() || "Membre du bureau exécutif de la CGE ARSTM.",
          image: image || "https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&q=80&w=400"
        };

        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('bureau_members').insert(memberData).select().single();
          if (error) {
            showToastMsg("Impossible d'enregistrer ce membre sur le serveur : " + error.message);
            return;
          }
          setMembers(prev => [...prev, mapMemberRow(data)]);
        } else {
          const newId = members.length ? Math.max(...members.map(m => m.id)) + 1 : 1;
          setMembers(prev => [...prev, { id: newId, pinHash, ...memberData }]);
        }
        closeAddMemberModal();
        showToastMsg(`${memberData.name} a été ajouté(e) au bureau.`);
      }
    } finally {
      setIsSavingMember(false);
    }
  };

  const handleDeleteMember = async (member) => {
    if (supabaseClient) {
      const { data: deletedRows, error } = await supabaseClient.from('bureau_members').delete().eq('id', member.id).select('id');
      if (error) {
        showToastMsg("Impossible de retirer ce membre sur le serveur : " + error.message);
        return;
      }
      if (!deletedRows || deletedRows.length === 0) {
        showToastMsg("Suppression refusée par Supabase. Vérifiez les politiques RLS DELETE/SELECT de bureau_members.");
        return;
      }
    }
    setMembers(prev => prev.filter(m => m.id !== member.id));
    setMemberToDelete(null);
    showToastMsg(`${member.name} a été retiré(e) du bureau.`);
  };

  const openAddResource = (type) => {
    const config = RESOURCE_CONFIGS[type];
    const blank = {};
    config.fields.forEach(f => { blank[f.key] = ''; });
    setResourceForm(blank);
    setResourceModal({ type, editingId: null });
  };

  const openEditResource = (type, item) => {
    const config = RESOURCE_CONFIGS[type];
    const values = {};
    config.fields.forEach(f => { values[f.key] = item[f.key] || ''; });
    setResourceForm(values);
    setResourceModal({ type, editingId: item.id });
  };

  const closeResourceModal = () => {
    setResourceModal({ type: null, editingId: null });
    setResourceForm({});
  };

  const handleResourceImageUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setResourceForm(f => ({ ...f, image: reader.result }));
    reader.readAsDataURL(file);
  };

  const handleSaveResource = async () => {
    const { type, editingId } = resourceModal;
    const config = RESOURCE_CONFIGS[type];
    const [, setter] = RESOURCE_STATE[type];

    for (const f of config.fields) {
      if (f.required && !String(resourceForm[f.key] || '').trim()) {
        showToastMsg(`Le champ « ${f.label} » est obligatoire.`);
        return;
      }
    }

    const payload = {};
    config.fields.forEach(f => { payload[f.key] = typeof resourceForm[f.key] === 'string' ? resourceForm[f.key].trim() : resourceForm[f.key]; });

    setIsSavingResource(true);
    try {
      if (editingId) {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from(config.table).update(payload).eq('id', editingId).select().single();
          if (error) {
            showToastMsg(`Impossible de modifier ${config.label} sur le serveur : ` + error.message);
            return;
          }
          setter(prev => prev.map(item => item.id === editingId ? data : item));
        } else {
          setter(prev => prev.map(item => item.id === editingId ? { ...item, ...payload } : item));
        }
        showToastMsg(`${config.titleSingular} modifié(e) avec succès.`);
      } else {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from(config.table).insert(payload).select().single();
          if (error) {
            showToastMsg(`Impossible d'enregistrer ${config.label} sur le serveur : ` + error.message);
            return;
          }
          setter(prev => [...prev, data]);
        } else {
          const [current] = RESOURCE_STATE[type];
          const newId = current.length ? Math.max(...current.map(i => i.id)) + 1 : 1;
          setter(prev => [...prev, { id: newId, ...payload }]);
        }
        showToastMsg(`${config.titleSingular} ajouté(e) avec succès.`);
      }
      closeResourceModal();
    } finally {
      setIsSavingResource(false);
    }
  };

  const handleDeleteResource = async () => {
    const { type, item } = resourceToDelete;

      const { data: deletedRows, error } = await supabaseClient.from(config.table).delete().eq('id', item.id).select('id');

        showToastMsg(`Suppression refusée par Supabase. Vérifiez les politiques RLS DELETE/SELECT de ${config.table}.`);
        return;
      }
    }
    setter(prev => prev.filter(i => i.id !== item.id));
    setResourceToDelete(null);
    showToastMsg(`${config.titleSingular} supprimé(e) avec succès.`);

                      <span className="text-[10px] font-extrabold uppercase tracking-widest text-orange-600 bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full inline-block mb-2">{m.role}</span>
                      <h3 className="font-serif text-xl font-bold text-stone-900">{m.name}</h3>
                      <p className="text-stone-600 text-sm mt-2 leading-relaxed">{m.bio}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* EMPLOIS & STAGES VIEW */}
        {activeTab === 'emplois' && (
          isUserAuthenticated ? (
            <div className="space-y-8">
              <div className="flex flex-wrap items-end justify-between gap-4">
                <div>
                  <h2 className="font-serif text-3xl font-bold text-stone-900">Offres d'Emplois & Stages</h2>
                  <p className="text-stone-500">Espace réservé — Opportunités professionnelles maritimes et industrielles</p>
                </div>
                {isAdminLoggedIn && (
                  <button onClick={() => openAddResource('jobs')} className="hover-scale flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-orange-600 text-white text-xs font-semibold shadow-lg shadow-orange-600/30">
                    <Plus className="w-4 h-4" /> Ajouter une offre
                  </button>
                )}
              </div>
              <div className="space-y-4">
                {jobs.map(j => (
                  <div key={j.id} className="glass-card p-6 rounded-3xl hover-scale flex flex-col md:flex-row md:items-center justify-between gap-6 relative">
                    {isAdminLoggedIn && (
                      <div className="absolute top-4 right-4 flex gap-2">
                        <button onClick={() => openEditResource('jobs', j)} className="w-9 h-9 rounded-full bg-white/80 backdrop-blur border border-white/70 flex items-center justify-center text-orange-600 hover:bg-orange-600 hover:text-white transition duration-200"><Pencil className="w-4 h-4" /></button>
                        <button onClick={() => setResourceToDelete({ type: 'jobs', item: j })} className="w-9 h-9 rounded-full bg-white/80 backdrop-blur border border-white/70 flex items-center justify-center text-rose-600 hover:bg-rose-600 hover:text-white transition duration-200"><Trash className="w-4 h-4" /></button>
                      </div>
                    )}
                    <div className="space-y-2">
                      <span className="text-xs font-bold text-emerald-700 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">{j.type}</span>
                      <h3 className="font-serif text-xl font-bold text-stone-900">{j.title}</h3>
                      <p className="text-sm font-semibold text-stone-600 flex items-center gap-2"><Building className="w-4 h-4 text-orange-600" /> {j.company}</p>
                      <p className="text-stone-600 text-sm">{j.description}</p>
                    </div>
                    <button onClick={() => showToastMsg("Candidature transmise avec succès !")} className="hover-scale px-6 py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 whitespace-nowrap">
                      Postuler
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="max-w-md mx-auto glass-card p-8 rounded-3xl text-center space-y-4">
              <Key className="w-12 h-12 mx-auto text-orange-600" />
              <h3 className="font-serif text-xl font-bold">Espace Réservé</h3>
              <p className="text-stone-600 text-sm">Vous devez vous connecter à votre espace membre pour consulter les offres d'emploi et de stage.</p>
              <button onClick={() => setShowMemberModal(true)} className="hover-scale px-6 py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30">
                Se connecter
              </button>
            </div>
          )
        )}

        {/* ACTIVITES VIEW */}
        {activeTab === 'activites' && (
          <div className="space-y-8">
            <div className="flex flex-wrap items-end justify-between gap-4">
              <h2 className="font-serif text-3xl font-bold text-stone-900">Activités & Projets</h2>
              {isAdminLoggedIn && (
                <button onClick={() => openAddResource('events')} className="hover-scale flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-orange-600 text-white text-xs font-semibold shadow-lg shadow-orange-600/30">
                  <Plus className="w-4 h-4" /> Ajouter un événement
                </button>
              )}
            </div>
            {events.length === 0 ? (
              <div className="glass-card p-8 rounded-3xl text-center space-y-4">
                <Calendar className="w-12 h-12 mx-auto text-orange-600" />
                <h3 className="font-serif text-xl font-bold">Calendrier des événements à venir</h3>
                <p className="text-stone-600 text-sm max-w-md mx-auto">Consultez régulièrement cette rubrique pour suivre les ateliers technologiques, séminaires et rencontres sportives.</p>
              </div>
            ) : (
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {events.map(ev => (
                  <div key={ev.id} className="glass-card p-6 rounded-3xl hover-scale space-y-3 relative">
                    {isAdminLoggedIn && <div className="absolute top-4 right-4 flex gap-2"><button onClick={() => openEditResource('events', ev)} className="w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-orange-600 hover:bg-orange-600 hover:text-white"><Pencil className="w-4 h-4" /></button><button onClick={() => setResourceToDelete({type:'events',item:ev})} className="w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-rose-600 hover:bg-rose-600 hover:text-white"><Trash className="w-4 h-4" /></button></div>}
                    <span className="text-xs font-bold text-orange-600 bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full inline-block">{ev.date}</span>
                    <h3 className="font-serif text-lg font-bold text-stone-900 pr-16">{ev.title}</h3>
                    <p className="text-stone-600 text-sm">{ev.description}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ALUMNI VIEW */}
        {activeTab === 'alumni' && (
          <div className="space-y-8">
            <div className="flex flex-wrap items-end justify-between gap-4">
              <h2 className="font-serif text-3xl font-bold text-stone-900">Réseau Alumni</h2>
              {isAdminLoggedIn && (
                <button onClick={() => openAddResource('alumni')} className="hover-scale flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-orange-600 text-white text-xs font-semibold shadow-lg shadow-orange-600/30">
                  <Plus className="w-4 h-4" /> Ajouter un alumni
                </button>
              )}
            </div>
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {alumni.map(a => (
                <div key={a.id} className="glass-card p-6 rounded-3xl hover-scale space-y-3 relative">
                  {isAdminLoggedIn && <div className="absolute top-4 right-4 flex gap-2"><button onClick={() => openEditResource('alumni', a)} className="w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-orange-600 hover:bg-orange-600 hover:text-white"><Pencil className="w-4 h-4" /></button><button onClick={() => setResourceToDelete({type:'alumni',item:a})} className="w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-rose-600 hover:bg-rose-600 hover:text-white"><Trash className="w-4 h-4" /></button></div>}
                  <div className="flex justify-between items-start pr-16">
                    <h3 className="font-serif text-lg font-bold text-stone-900">{a.name}</h3>
                    <span className="text-xs font-bold text-orange-600 bg-orange-500/10 px-2.5 py-1 rounded-lg whitespace-nowrap">Promo {a.promo}</span>
                  </div>
                  <p className="text-sm font-semibold text-stone-700">{a.role}</p>
                  <p className="text-xs text-stone-500 flex items-center gap-1.5"><Building className="w-4 h-4 text-orange-500" /> {a.company}</p>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* MEDIATHEQUE VIEW */}
        {activeTab === 'mediatheque' && (
          <div className="space-y-8">
            <div className="flex flex-wrap items-end justify-between gap-4">
              <h2 className="font-serif text-3xl font-bold text-stone-900">Médiathèque Officielle</h2>
              {isAdminLoggedIn && (
                <button onClick={() => openAddResource('gallery')} className="hover-scale flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-orange-600 text-white text-xs font-semibold shadow-lg shadow-orange-600/30">
                  <Plus className="w-4 h-4" /> Ajouter un média
                </button>
              )}
            </div>
            <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-6">
              {gallery.map(item => (
                <div key={item.id} className="glass-card rounded-3xl overflow-hidden hover-scale group relative">
                  {isAdminLoggedIn && <div className="absolute top-3 right-3 z-10 flex gap-2"><button onClick={() => openEditResource('gallery', item)} className="w-9 h-9 rounded-full bg-white/90 flex items-center justify-center text-orange-600 hover:bg-orange-600 hover:text-white"><Pencil className="w-4 h-4" /></button><button onClick={() => setResourceToDelete({type:'gallery',item})} className="w-9 h-9 rounded-full bg-white/90 flex items-center justify-center text-rose-600 hover:bg-rose-600 hover:text-white"><Trash className="w-4 h-4" /></button></div>}
                  <img src={item.image} alt={item.title} className="w-full h-52 object-cover transition duration-500 group-hover:scale-105" />
                  <div className="p-5">
                    <span className="text-[10px] font-bold uppercase tracking-wide text-orange-600">{item.category}</span>
                    <h4 className="font-serif font-bold text-stone-900">{item.title}</h4>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* CONTACT VIEW */}
        {activeTab === 'contact' && (
          <div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl space-y-6">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Contact</h2>
            <p className="text-stone-600 text-sm">Secrétariat de la Conférence des Grandes Écoles — ARSTM, Abidjan, Côte d'Ivoire.</p>
          </div>
        )}

        {/* ESPACE MEMBRE VIEW */}
        {activeTab === 'espace-membre' && currentUser && (
          <div className="max-w-xl mx-auto glass-card p-8 rounded-3xl text-center space-y-6">
            <div className="w-16 h-16 mx-auto rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
              <UserCheck className="w-8 h-8 text-orange-600" />
            </div>
            <div>
              <h2 className="font-serif text-2xl font-bold text-stone-900">
                {isAdminLoggedIn ? currentUser.name : `Bonjour, ${currentUser.name}`}
              </h2>
              {!isAdminLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">{currentUser.role} — {currentUser.matricule}</p>
              )}
              {isAdminLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">Accès administrateur</p>
              )}
            </div>
            <button onClick={handleLogout} className="hover-scale inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-stone-900 text-white font-semibold">
              <LogOut className="w-4 h-4" /> Se déconnecter
            </button>
          </div>
        )}

      </main>

      {/* BARRE EN BAS : APPLE LIQUID GLASS DOCK */}
      <div className="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
        <nav
          ref={navRef}
          onMouseLeave={() => setHoveredTab(null)}
          className="pointer-events-auto relative glass-dock p-2 rounded-full flex items-center gap-1 max-w-full overflow-x-auto no-scrollbar"
        >
          <div
            className="absolute top-2 bottom-2 liquid-pill rounded-full pointer-events-none"
            style={{
              left: `${pillStyle.left}px`,
              width: `${pillStyle.width}px`,
              opacity: pillStyle.opacity,
            }}
          />

          {navItems.map(item => {
            const Icon = item.icon;
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                data-tab={item.id}
                onClick={() => setActiveTab(item.id)}
                onMouseEnter={() => setHoveredTab(item.id)}
                className={`relative z-10 flex items-center gap-2 px-4 py-3 rounded-full text-xs font-bold transition-transform duration-300 transform hover:scale-110 active:scale-95 whitespace-nowrap ${
                  isActive || hoveredTab === item.id ? 'text-white' : 'text-stone-700 hover:text-stone-950'
                }`}
              >
                <Icon className="w-4 h-4" />
                <span className="hidden sm:inline">{item.label}</span>
              </button>
            );
          })}
        </nav>
      </div>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
