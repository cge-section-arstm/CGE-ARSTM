<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { 
    margin: 0; 
    background: linear-gradient(180deg, #e9f1f7 0%, #f3f6f6 35%, #fbf7ee 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  /* Effet Liquid Glass */
  .glass-card {
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }

  .glass-dock {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(25px) saturate(200%);
    -webkit-backdrop-filter: blur(25px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 30px 60px rgba(234, 88, 12, 0.12), 0 10px 25px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.9);
  }

  .liquid-pill {
    background: linear-gradient(135deg, rgba(234, 88, 12, 0.9) 0%, rgba(249, 115, 22, 0.85) 100%);
    box-shadow: 0 8px 20px rgba(234, 88, 12, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Animations de survol */
  .hover-scale {
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  }
  .hover-scale:hover {
    transform: translateY(-4px) scale(1.04);
  }

  @keyframes gentle-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .animate-bounce { animation: gentle-bounce 1.4s ease-in-out infinite; }
</style>

const getWelcomeMessage = (matricule, name, prefix = "Bienvenue") => {
  if (matricule && matricule.toUpperCase() === PRESIDENT_MATRICULE) {
    return `${prefix}, MR LE PRÉSIDENT`;

  return `${prefix}, ${name.split(' ')[0]}`;
};
const hashSecret = async (id, secret) => {
  const data = new TextEncoder().encode(`${SITE_SALT}|${id}|${secret}`);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
};

function App() {
  const [activeTab, setActiveTab] = useState('accueil');
  const [hoveredTab, setHoveredTab] = useState(null);
  const [toast, setToast] = useState(null);
  const [loginError, setLoginError] = useState('');
  const toastTimerRef = useRef(null);

  // Auth States
  const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [showMemberModal, setShowMemberModal] = useState(false);
  const [memberMatriculeInput, setMemberMatriculeInput] = useState('');
  const [memberPinInput, setMemberPinInput] = useState('');
  const [failedAttempts, setFailedAttempts] = useState(0);
  const [isLocked, setIsLocked] = useState(false);
  const [isCheckingLogin, setIsCheckingLogin] = useState(false);

  // Gestion admin des membres du bureau
  const [showAddMemberModal, setShowAddMemberModal] = useState(false);
  const [editingMemberId, setEditingMemberId] = useState(null);
  const [memberToDelete, setMemberToDelete] = useState(null);
  const [newMemberForm, setNewMemberForm] = useState({ name: '', role: '', matricule: '', bio: '', pin: '', image: '' });
  const [isSavingMember, setIsSavingMember] = useState(false);

  // Espace Admin / Gestion des membres inscrits
  const [adminSearchQuery, setAdminSearchQuery] = useState('');
  const [resetModalMember, setResetModalMember] = useState(null);
  const [showChangePwd, setShowChangePwd] = useState(false);
  const [pwdForm, setPwdForm] = useState({ current: '', next: '', confirm: '' });
  const [pwdError, setPwdError] = useState('');
  const [isChangingPwd, setIsChangingPwd] = useState(false);
  const [newPinResetInput, setNewPinResetInput] = useState('');
  const [isResettingPin, setIsResettingPin] = useState(false);

  // Gestion admin générique
  const [resourceModal, setResourceModal] = useState({ type: null, editingId: null });
  const [resourceForm, setResourceForm] = useState({});
  const [isSavingResource, setIsSavingResource] = useState(false);
  const [resourceToDelete, setResourceToDelete] = useState(null);

  // Navigation Ref
  const navRef = useRef(null);
  const [pillStyle, setPillStyle] = useState({ left: 0, width: 0, opacity: 0 });

  // Data Stores
  const [members, setMembers] = useState(initialMembers);
  const [news, setNews] = useState(initialNews);
  const [jobs, setJobs] = useState(initialJobs);
  const [alumni, setAlumni] = useState(initialAlumni);
  const [gallery, setGallery] = useState(initialGallery);
  const [events, setEvents] = useState(initialEvents);
  const [registry, setRegistry] = useState(initialRegistry);
  const [isSyncing, setIsSyncing] = useState(false);
  const [supabaseReady, setSupabaseReady] = useState(false);

  const mapMemberRow = (row) => ({ id: row.id, matricule: row.matricule, pinHash: row.pin_hash, name: row.name, role: row.role, bio: row.bio, image: row.image });
  const mapRegistryRow = (row) => ({ id: row.id, matricule: row.matricule, pinHash: row.pin_hash, name: row.name, role: row.role });

  const RESOURCE_STATE = { news: [news, setNews, initialNews], jobs: [jobs, setJobs, initialJobs], events: [events, setEvents, initialEvents], alumni: [alumni, setAlumni, initialAlumni], gallery: [gallery, setGallery, initialGallery] };

  useEffect(() => {
    if (!supabaseClient) return;
    (async () => {
      setIsSyncing(true);
      try {
        const { data: memberRows, error: mErr } = await supabaseClient.from('bureau_members').select('*').order('id');
        if (!mErr && memberRows) {
          setSupabaseReady(true);
          setMembers(memberRows.map(mapMemberRow));
        }
        const { data: regRows, error: rErr } = await supabaseClient.from('member_registry').select('*').order('id');
        if (!rErr && regRows) {
          setRegistry(regRows.map(mapRegistryRow));
        }
        for (const type of Object.keys(RESOURCE_CONFIGS)) {
          const { table } = RESOURCE_CONFIGS[type];
          const { data: rows, error } = await supabaseClient.from(table).select('*').order('id');
          if (!error && rows) {
            const setter = RESOURCE_STATE[type][1];
            setter(rows);
          }
        }
      } catch (e) {
        console.error('Supabase sync error:', e);
      } finally {
        setIsSyncing(false);
      }
    })();
  }, []);

  const isUserAuthenticated = currentUser !== null || isAdminLoggedIn;

  const baseNavItems = [
    { id: 'accueil', label: 'Accueil', icon: Home },
    { id: 'bureau', label: 'Membres', icon: Users },
    { id: 'emplois', label: 'Emplois & Stages', icon: Briefcase, protected: true },
    { id: 'activites', label: 'Activités', icon: Calendar },
    { id: 'alumni', label: 'Alumni', icon: GraduationCap },
    { id: 'mediatheque', label: 'Médiathèque', icon: Image },
    { id: 'admin-space', label: 'Gestion Admin', icon: ShieldCheck, adminOnly: true },
    { id: 'contact', label: 'Contact', icon: Mail },
  ];

  const navItems = baseNavItems.filter(item => {
    if (item.adminOnly) return isAdminLoggedIn;
    if (item.protected) return isUserAuthenticated;
    return true;
  });

  const ERROR_PATTERN = /(incorrect|erreur|impossible|refus|verrouill|obligatoire|veuillez|déjà utilisé|échou)/i;
  const showToastMsg = (msg, type) => {
    const kind = type || (ERROR_PATTERN.test(msg) ? 'error' : 'success');
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ msg, type: kind });
    toastTimerRef.current = setTimeout(() => setToast(null), kind === 'error' ? 6000 : 3500);
  };

  useEffect(() => {
    const targetId = hoveredTab || activeTab;
    if (!navRef.current) return;
    const targetEl = navRef.current.querySelector(`[data-tab="${targetId}"]`);
    if (targetEl) {
      setPillStyle({
        left: targetEl.offsetLeft,
        width: targetEl.offsetWidth,
        opacity: 1
      });
    } else {
      setPillStyle(prev => ({ ...prev, opacity: 0 }));
    }
  }, [activeTab, hoveredTab, isUserAuthenticated, isAdminLoggedIn]);

  const closeMemberModal = () => {
    setShowMemberModal(false);
    setMemberMatriculeInput('');
    setMemberPinInput('');
    setLoginError('');
  };

  const handleMemberLogin = async () => {
    if (isLocked) return;
    const id = memberMatriculeInput.trim();
    const secret = memberPinInput.trim();
    if (!id || !secret) {
      setLoginError("Veuillez renseigner l'identifiant et le code.");
      return;
    }

    setLoginError('');
    setIsCheckingLogin(true);
    try {
      const admin = ADMIN_ACCOUNTS.find(a => a.login.toLowerCase() === id.toLowerCase());
      if (admin) {
        const h = await hashSecret(admin.login, secret);
        if (h === admin.hash) {
          setIsAdminLoggedIn(true);
          setCurrentUser({ name: admin.name });
          setFailedAttempts(0);
          setIsLocked(false);
          closeMemberModal();
          showToastMsg(`Bienvenue, ${admin.name}`);
          return;
        }
      } else {
        const member = members.find(m => m.matricule.toLowerCase() === id.toLowerCase());
        if (member) {
          const h = await hashSecret(member.matricule, secret);
          if (h === member.pinHash) {
            setIsAdminLoggedIn(false);
            setCurrentUser(member);
            setFailedAttempts(0);
            setIsLocked(false);
            closeMemberModal();
            showToastMsg(`Bienvenue, ${member.name.split(' ')[0]}`);
            return;
          }
        } else {
          const registrant = registry.find(r => r.matricule.toLowerCase() === id.toLowerCase());
          if (registrant) {
            if (!registrant.pinHash) {
              const h = await hashSecret(registrant.matricule, secret);
              const activated = { ...registrant, pinHash: h };
              setRegistry(prev => prev.map(r => r.id === registrant.id ? activated : r));
              if (supabaseClient) {
                await supabaseClient.from('member_registry').update({ pin_hash: h }).eq('id', registrant.id);
              }
              setIsAdminLoggedIn(false);
              setCurrentUser(activated);
              setFailedAttempts(0);
              setIsLocked(false);
              closeMemberModal();
              showToastMsg(getWelcomeMessage(activated.matricule, activated.name, "Compte activé. Bienvenue"));
              return;
            }
            const h = await hashSecret(registrant.matricule, secret);
            if (h === registrant.pinHash) {
              setIsAdminLoggedIn(false);
              setCurrentUser(registrant);
              setFailedAttempts(0);
              setIsLocked(false);
              closeMemberModal();
              showToastMsg(getWelcomeMessage(registrant.matricule, registrant.name));
              return;
            }
          }
        }
      }

      const attempts = failedAttempts + 1;
      setFailedAttempts(attempts);
      const remaining = MAX_LOGIN_ATTEMPTS - attempts;
      if (remaining <= 0) {
        setIsLocked(true);
        setLoginError('');
      } else {
        setLoginError(`Identifiant ou code incorrect. Il vous reste ${remaining} tentative${remaining > 1 ? 's' : ''}.`);
        setMemberPinInput('');
      }
    } finally {
      setIsCheckingLogin(false);
    }
  };

  const handleLogout = () => {
    setCurrentUser(null);
    setIsAdminLoggedIn(false);
    setActiveTab('accueil');
    showToastMsg("Déconnexion réussie.");
  };

  // --- Changement de mot de passe par le membre lui-même ---
  const closeChangePwd = () => {
    setShowChangePwd(false);
    setPwdForm({ current: '', next: '', confirm: '' });
    setPwdError('');
  };

  const handleChangeOwnPassword = async () => {
    if (!currentUser || isAdminLoggedIn) return;
    const current = pwdForm.current.trim();
    const next = pwdForm.next.trim();
    const confirm = pwdForm.confirm.trim();
    if (!current || !next || !confirm) { setPwdError("Veuillez remplir les trois champs."); return; }
    if (next.length < 4) { setPwdError("Le nouveau mot de passe doit contenir au moins 4 caractères."); return; }
    if (next !== confirm) { setPwdError("La confirmation ne correspond pas au nouveau mot de passe."); return; }
    if (next === current) { setPwdError("Le nouveau mot de passe doit être différent de l'actuel."); return; }

    setPwdError('');
    setIsChangingPwd(true);
    try {
      const isBureauMember = members.some(m => m.id === currentUser.id && m.matricule === currentUser.matricule);
      const record = isBureauMember
        ? members.find(m => m.id === currentUser.id)
        : registry.find(r => r.id === currentUser.id);
      if (!record) { setPwdError("Compte introuvable. Veuillez vous reconnecter."); return; }

      const currentHash = await hashSecret(record.matricule, current);
      if (currentHash !== record.pinHash) { setPwdError("Le mot de passe actuel est incorrect."); return; }

      const pinHash = await hashSecret(record.matricule, next);
      if (supabaseClient) {
        const table = isBureauMember ? 'bureau_members' : 'member_registry';
        const { error } = await supabaseClient.from(table).update({ pin_hash: pinHash }).eq('id', record.id);
        if (error) { setPwdError("Impossible d'enregistrer le nouveau mot de passe : " + error.message); return; }
      }
      if (isBureauMember) {
        setMembers(prev => prev.map(m => m.id === record.id ? { ...m, pinHash } : m));
      } else {
        setRegistry(prev => prev.map(r => r.id === record.id ? { ...r, pinHash } : r));
      }
      setCurrentUser(u => ({ ...u, pinHash }));
      closeChangePwd();
      showToastMsg("Votre mot de passe a été modifié avec succès.", 'success');
    } catch (err) {
      setPwdError("Erreur lors du changement de mot de passe : " + err.message);
    } finally {
      setIsChangingPwd(false);
    }
  };

  // --- Réinitialisation de mot de passe par l'administrateur ---
  const handleAdminResetPin = async () => {
    if (!resetModalMember) return;
    const newPin = newPinResetInput.trim();
    if (!newPin) {
      showToastMsg("Veuillez saisir un nouveau code PIN / mot de passe.");
      return;
    }

    setIsResettingPin(true);
    try {
      const pinHash = await hashSecret(resetModalMember.matricule, newPin);
      
      // Mise à jour si c'est un membre du bureau
      const isBureauMember = members.some(m => m.id === resetModalMember.id && m.matricule === resetModalMember.matricule);
      
      if (isBureauMember) {
        setMembers(prev => prev.map(m => m.id === resetModalMember.id ? { ...m, pinHash } : m));
        if (supabaseClient) {
          await supabaseClient.from('bureau_members').update({ pin_hash: pinHash }).eq('id', resetModalMember.id);
        }
      } else {
        setRegistry(prev => prev.map(r => r.id === resetModalMember.id ? { ...r, pinHash } : r));
        if (supabaseClient) {
          await supabaseClient.from('member_registry').update({ pin_hash: pinHash }).eq('id', resetModalMember.id);
        }
      }

      // Si le compte était verrouillé
      if (isLocked) setIsLocked(false);

      showToastMsg(`Mot de passe réinitialisé pour ${resetModalMember.name}.`);
      setResetModalMember(null);
      setNewPinResetInput('');
    } catch (err) {
      showToastMsg("Erreur lors de la réinitialisation : " + err.message);
    } finally {
      setIsResettingPin(false);
    }
  };

  const closeAddMemberModal = () => {
    setShowAddMemberModal(false);
    setEditingMemberId(null);
    setNewMemberForm({ name: '', role: '', matricule: '', bio: '', pin: '', image: '' });
  };

  const openAddMemberModal = () => {
    setEditingMemberId(null);
    setNewMemberForm({ name: '', role: '', matricule: '', bio: '', pin: '', image: '' });
    setShowAddMemberModal(true);
  };

  const openEditMemberModal = (m) => {
    setEditingMemberId(m.id);
    setNewMemberForm({ name: m.name, role: m.role, matricule: m.matricule, bio: m.bio || '', pin: '', image: m.image || '' });
    setShowAddMemberModal(true);
  };

  const handleMemberPhotoUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setNewMemberForm(f => ({ ...f, image: reader.result }));
    reader.readAsDataURL(file);
  };

  const handleSaveMember = async () => {
    const { name, role, matricule, bio, pin, image } = newMemberForm;
    const isEditing = editingMemberId !== null;

    if (!name.trim() || !role.trim() || !matricule.trim() || (!isEditing && !pin.trim())) {
      showToastMsg(isEditing ? "Nom, rôle et matricule sont obligatoires." : "Nom, rôle, matricule et code PIN sont obligatoires.");
      return;
    }
    if (members.some(m => m.matricule.toLowerCase() === matricule.trim().toLowerCase() && m.id !== editingMemberId)) {
      showToastMsg("Ce matricule est déjà utilisé par un autre membre.");
      return;
    }

    setIsSavingMember(true);
    try {
      if (isEditing) {
        const memberData = {
          matricule: matricule.trim(),
          name: name.trim(),
          role: role.trim(),
          bio: bio.trim() || "Membre du bureau exécutif de la CGE ARSTM.",
          image: image || "https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&q=80&w=400"
        };
        let newPinHash = null;
        if (pin.trim()) {
          newPinHash = await hashSecret(matricule.trim(), pin.trim());
          memberData.pin_hash = newPinHash;
        }

        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('bureau_members').update(memberData).eq('id', editingMemberId).select().single();
          if (error) {
            showToastMsg("Impossible de modifier ce membre sur le serveur : " + error.message);
            return;
          }
          setMembers(prev => prev.map(m => m.id === editingMemberId ? mapMemberRow(data) : m));
        } else {
          setMembers(prev => prev.map(m => m.id === editingMemberId ? { ...m, ...memberData, pinHash: newPinHash || m.pinHash } : m));
        }
        setCurrentUser(prev => (prev && prev.id === editingMemberId && !isAdminLoggedIn) ? { ...prev, ...memberData, pinHash: newPinHash || prev.pinHash } : prev);
        closeAddMemberModal();
        showToastMsg(`${memberData.name} a été modifié(e) avec succès.`);
      } else {
        const pinHash = await hashSecret(matricule.trim(), pin.trim());
        const memberData = {
          matricule: matricule.trim(),
          pin_hash: pinHash,
          name: name.trim(),
          role: role.trim(),
          bio: bio.trim() || "Membre du bureau exécutif de la CGE ARSTM.",
          image: image || "https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&q=80&w=400"
        };

        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('bureau_members').insert(memberData).select().single();
          if (error) {
            showToastMsg("Impossible d'enregistrer ce membre sur le serveur : " + error.message);
            return;
          }
          setMembers(prev => [...prev, mapMemberRow(data)]);
        } else {
          const newId = members.length ? Math.max(...members.map(m => m.id)) + 1 : 1;
          setMembers(prev => [...prev, { id: newId, pinHash, ...memberData }]);
        }
        closeAddMemberModal();
        showToastMsg(`${memberData.name} a été ajouté(e) au bureau.`);
      }
    } finally {
      setIsSavingMember(false);
    }
  };

  const handleDeleteMember = async (member) => {
    if (supabaseClient) {
      const { data: deletedRows, error } = await supabaseClient.from('bureau_members').delete().eq('id', member.id).select('id');
      if (error) {
        showToastMsg("Impossible de retirer ce membre sur le serveur : " + error.message);
        return;
      }
      if (!deletedRows || deletedRows.length === 0) {
        showToastMsg("Suppression refusée par Supabase. Vérifiez les politiques RLS DELETE/SELECT de bureau_members.");
        return;
      }
    }
    setMembers(prev => prev.filter(m => m.id !== member.id));
    setMemberToDelete(null);
    showToastMsg(`${member.name} a été retiré(e) du bureau.`);
  };

  const openAddResource = (type) => {
    const config = RESOURCE_CONFIGS[type];
    const blank = {};
    config.fields.forEach(f => { blank[f.key] = ''; });
    setResourceForm(blank);
    setResourceModal({ type, editingId: null });
  };

  const openEditResource = (type, item) => {
    const config = RESOURCE_CONFIGS[type];
    const values = {};
    config.fields.forEach(f => { values[f.key] = item[f.key] || ''; });
    setResourceForm(values);
    setResourceModal({ type, editingId: item.id });
  };

  const closeResourceModal = () => {
    setResourceModal({ type: null, editingId: null });
    setResourceForm({});
  };

  const handleResourceImageUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setResourceForm(f => ({ ...f, image: reader.result }));
    reader.readAsDataURL(file);
  };

  const handleSaveResource = async () => {
    const { type, editingId } = resourceModal;
    const config = RESOURCE_CONFIGS[type];
    const [, setter] = RESOURCE_STATE[type];

    for (const f of config.fields) {
      if (f.required && !String(resourceForm[f.key] || '').trim()) {
        showToastMsg(`Le champ « ${f.label} » est obligatoire.`);
        return;
      }
    }

    const payload = {};
    config.fields.forEach(f => { payload[f.key] = typeof resourceForm[f.key] === 'string' ? resourceForm[f.key].trim() : resourceForm[f.key]; });

    setIsSavingResource(true);
    try {
      if (editingId) {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from(config.table).update(payload).eq('id', editingId).select().single();
          if (error) {
            showToastMsg(`Impossible de modifier ${config.label} sur le serveur : ` + error.message);
            return;
          }
          setter(prev => prev.map(item => item.id === editingId ? data : item));
        } else {
          setter(prev => prev.map(item => item.id === editingId ? { ...item, ...payload } : item));
        }
        showToastMsg(`${config.titleSingular} modifié(e) avec succès.`);
      } else {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from(config.table).insert(payload).select().single();
          if (error) {
            showToastMsg(`Impossible d'enregistrer ${config.label} sur le serveur : ` + error.message);
            return;
          }
          setter(prev => [...prev, data]);
        } else {
          const [current] = RESOURCE_STATE[type];
          const newId = current.length ? Math.max(...current.map(i => i.id)) + 1 : 1;
          setter(prev => [...prev, { id: newId, ...payload }]);
        }
        showToastMsg(`${config.titleSingular} ajouté(e) avec succès.`);
      }
      closeResourceModal();
    } finally {
      setIsSavingResource(false);
    }
  };

  const handleDeleteResource = async () => {
    const { type, item } = resourceToDelete;
    const config = RESOURCE_CONFIGS[type];
    const [, setter] = RESOURCE_STATE[type];
    if (supabaseClient) {
      const { data: deletedRows, error } = await supabaseClient.from(config.table).delete().eq('id', item.id).select('id');
      if (error) {
        showToastMsg(`Impossible de supprimer ${config.label} sur le serveur : ` + error.message);
        return;
      }
      if (!deletedRows || deletedRows.length === 0) {
        showToastMsg(`Suppression refusée par Supabase. Vérifiez les politiques RLS DELETE/SELECT de ${config.table}.`);
        return;
      }
    }
    setter(prev => prev.filter(i => i.id !== item.id));
    setResourceToDelete(null);
    showToastMsg(`${config.titleSingular} supprimé(e) avec succès.`);
  };

  // Filtrage de la recherche admin
  const filteredRegistry = registry.filter(item => 
    item.name.toLowerCase().includes(adminSearchQuery.toLowerCase()) || 
    item.matricule.toLowerCase().includes(adminSearchQuery.toLowerCase())
  );

  return (
    <div className="min-h-screen flex flex-col text-stone-800 font-sans antialiased selection:bg-orange-500 selection:text-white">
      <MaritimeBackground />
      
      {/* Toast Notification */}
      {toast && (
        <div
          role={toast.type === 'error' ? 'alert' : 'status'}
          aria-live={toast.type === 'error' ? 'assertive' : 'polite'}
          onClick={() => setToast(null)}
          style={{ zIndex: 9999 }}
          className={`fixed top-6 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md px-5 py-4 rounded-2xl shadow-2xl flex items-start gap-3 border-2 cursor-pointer ${toast.type === 'error' ? 'bg-rose-600 border-rose-700 text-white' : 'bg-white border-orange-200 text-stone-900'}`}
        >
          {toast.type === 'error'
            ? <AlertCircle className="text-white w-5 h-5 flex-shrink-0 mt-0.5" />
            : <CheckCircle className="text-orange-600 w-5 h-5 flex-shrink-0 mt-0.5" />}
          <span className="text-sm font-semibold leading-snug">{toast.msg}</span>
        </div>
      )}

      {/* MODALE REINITIALISATION CODE PIN (ADMIN) */}
      {resetModalMember && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={() => setResetModalMember(null)}>
          <div className="glass-card w-full max-w-sm rounded-3xl p-8 space-y-5 relative" onClick={e => e.stopPropagation()}>
            <button onClick={() => setResetModalMember(null)} className="absolute top-5 right-5 text-stone-400 hover:text-stone-700"><X className="w-5 h-5" /></button>
            <div className="space-y-1">
              <div className="w-11 h-11 rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
                <RefreshCw className="w-5 h-5 text-orange-600" />
              </div>
              <h3 className="font-serif text-xl font-bold text-stone-900 pt-2">Réinitialiser le Code PIN</h3>
              <p className="text-xs text-stone-500">Définissez un nouveau mot de passe/code PIN pour <strong>{resetModalMember.name}</strong> ({resetModalMember.matricule}).</p>
            </div>
            <input
              type="password"
              placeholder="Nouveau code PIN / mot de passe"
              value={newPinResetInput}
              onChange={(e) => setNewPinResetInput(e.target.value)}
              className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
            <button
              onClick={handleAdminResetPin}
              disabled={isResettingPin}
              className="hover-scale w-full py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 disabled:opacity-60"
            >
              {isResettingPin ? "Modification..." : "Valider la modification"}
            </button>
          </div>
        </div>
      )}

      {/* MODALE CHANGEMENT DE MOT DE PASSE (MEMBRE) */}
      {showChangePwd && currentUser && !isAdminLoggedIn && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={closeChangePwd}>
          <div className="glass-card w-full max-w-sm rounded-3xl p-8 space-y-5 relative" onClick={e => e.stopPropagation()}>
            <button onClick={closeChangePwd} className="absolute top-5 right-5 text-stone-400 hover:text-stone-700" aria-label="Fermer"><X className="w-5 h-5" /></button>
            <div className="space-y-1">
              <div className="w-11 h-11 rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
                <Key className="w-5 h-5 text-orange-600" />
              </div>
              <h3 className="font-serif text-xl font-bold text-stone-900 pt-2">Changer mon mot de passe</h3>
              <p className="text-xs text-stone-500">Saisissez votre mot de passe actuel, puis le nouveau (4 caractères minimum).</p>
            </div>
            <div className="space-y-3">
              <input
                type="password"
                autoFocus
                placeholder="Mot de passe actuel"
                value={pwdForm.current}
                onChange={(e) => { setPwdForm(f => ({ ...f, current: e.target.value })); setPwdError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleChangeOwnPassword()}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
              <input
                type="password"
                placeholder="Nouveau mot de passe"
                value={pwdForm.next}
                onChange={(e) => { setPwdForm(f => ({ ...f, next: e.target.value })); setPwdError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleChangeOwnPassword()}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
              <input
                type="password"
                placeholder="Confirmer le nouveau mot de passe"
                value={pwdForm.confirm}
                onChange={(e) => { setPwdForm(f => ({ ...f, confirm: e.target.value })); setPwdError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleChangeOwnPassword()}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
            {pwdError && (
              <div role="alert" className="flex items-start gap-2 px-4 py-3 rounded-2xl bg-rose-50 border border-rose-300 text-rose-700">
                <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                <span className="text-xs font-semibold leading-relaxed">{pwdError}</span>
              </div>
            )}
            <button
              onClick={handleChangeOwnPassword}
              disabled={isChangingPwd}
              className="hover-scale w-full py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 disabled:opacity-60"
            >
              {isChangingPwd ? "Enregistrement..." : "Enregistrer le nouveau mot de passe"}
            </button>
          </div>
        </div>
      )}

      {/* MODALE ESPACE MEMBRE */}
      {showMemberModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={closeMemberModal}>
          <div className="glass-card w-full max-w-sm rounded-3xl p-8 space-y-5 relative" onClick={(e) => e.stopPropagation()}>
            <button onClick={closeMemberModal} className="absolute top-5 right-5 text-stone-400 hover:text-stone-700" aria-label="Fermer"><X className="w-5 h-5" /></button>
            <div className="space-y-1">
              <div className="w-11 h-11 rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
                <Key className="w-5 h-5 text-orange-600" />
              </div>
              <h3 className="font-serif text-xl font-bold text-stone-900 pt-2">Espace Membre</h3>
              <p className="text-xs text-stone-500">Connectez-vous pour débloquer l'accès aux offres d'emplois & stages.</p>
            </div>
            <div className="space-y-3">
              <input
                type="text"
                autoFocus
                placeholder="Matricule / Identifiant"
                value={memberMatriculeInput}
                onChange={(e) => { setMemberMatriculeInput(e.target.value); setLoginError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleMemberLogin()}
                disabled={isLocked}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 disabled:opacity-50"
              />
              <input
                type="password"
                placeholder="Code PIN / Mot de passe"
                value={memberPinInput}
                onChange={(e) => { setMemberPinInput(e.target.value); setLoginError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleMemberLogin()}
                disabled={isLocked}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 disabled:opacity-50"
              />
            </div>
            {loginError && !isLocked && (
              <div role="alert" className="flex items-start gap-2 px-4 py-3 rounded-2xl bg-rose-50 border border-rose-300 text-rose-700">
                <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                <span className="text-xs font-semibold leading-relaxed">{loginError}</span>
              </div>
            )}
            {isLocked ? (
              <p role="alert" className="text-xs font-semibold text-rose-700 text-center leading-relaxed px-4 py-3 rounded-2xl bg-rose-50 border border-rose-300">Compte verrouillé après 5 tentatives infructueuses. Veuillez vous rapprocher du bureau informatique pour réinitialiser votre compte.</p>
            ) : (
              <button onClick={handleMemberLogin} disabled={isCheckingLogin} className="hover-scale w-full py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 disabled:opacity-60">
                {isCheckingLogin ? "Vérification..." : "Se connecter"}
              </button>
            )}
          </div>
        </div>
      )}

      {/* MODALE AJOUT / MODIFICATION MEMBRE DU BUREAU */}
      {showAddMemberModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={closeAddMemberModal}>
          <div className="glass-card w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-3xl p-7 space-y-5 relative" onClick={e => e.stopPropagation()}>
            <button onClick={closeAddMemberModal} className="absolute top-5 right-5 text-stone-400 hover:text-stone-700"><X className="w-5 h-5" /></button>
            <div><h3 className="font-serif text-xl font-bold text-stone-900">{editingMemberId !== null ? 'Modifier le membre' : 'Ajouter un membre'}</h3><p className="text-xs text-stone-500 mt-1">Renseignez les informations du membre du bureau.</p></div>
            <div className="grid sm:grid-cols-2 gap-3">
              <input value={newMemberForm.name} onChange={e => setNewMemberForm(f => ({...f,name:e.target.value}))} placeholder="Nom complet *" className="px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <input value={newMemberForm.role} onChange={e => setNewMemberForm(f => ({...f,role:e.target.value}))} placeholder="Fonction / rôle *" className="px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <input value={newMemberForm.matricule} onChange={e => setNewMemberForm(f => ({...f,matricule:e.target.value}))} placeholder="Matricule *" className="px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <input type="password" value={newMemberForm.pin} onChange={e => setNewMemberForm(f => ({...f,pin:e.target.value}))} placeholder={editingMemberId !== null ? 'Nouveau PIN (facultatif)' : 'Code PIN *'} className="px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
            </div>
            <textarea value={newMemberForm.bio} onChange={e => setNewMemberForm(f => ({...f,bio:e.target.value}))} placeholder="Biographie" rows="3" className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
            <div className="space-y-2"><label className="text-xs font-semibold text-stone-600">Photo</label><input type="file" accept="image/*" onChange={handleMemberPhotoUpload} className="w-full text-xs" />{newMemberForm.image && <img src={newMemberForm.image} alt="Aperçu" className="w-20 h-20 rounded-2xl object-cover" />}</div>
            <button onClick={handleSaveMember} disabled={isSavingMember} className="w-full py-3 rounded-2xl bg-orange-600 text-white font-semibold disabled:opacity-60">{isSavingMember ? 'Enregistrement...' : editingMemberId !== null ? 'Enregistrer les modifications' : 'Ajouter le membre'}</button>
          </div>
        </div>
      )}
      {/* CONFIRMATION SUPPRESSION MEMBRE */}
      {memberToDelete && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={() => setMemberToDelete(null)}>
          <div className="glass-card w-full max-w-sm rounded-3xl p-7 space-y-5" onClick={e => e.stopPropagation()}>
            <div className="w-11 h-11 rounded-2xl bg-rose-500/15 flex items-center justify-center"><Trash className="w-5 h-5 text-rose-600" /></div>
            <div><h3 className="font-serif text-xl font-bold">Retirer ce membre ?</h3><p className="text-sm text-stone-600 mt-2">Vous êtes sur le point de retirer <strong>{memberToDelete.name}</strong> du bureau.</p></div>
            <div className="flex gap-3"><button onClick={() => setMemberToDelete(null)} className="flex-1 py-3 rounded-2xl bg-white/70 border border-stone-200 font-semibold">Annuler</button><button onClick={() => handleDeleteMember(memberToDelete)} className="flex-1 py-3 rounded-2xl bg-rose-600 text-white font-semibold">Supprimer</button></div>
          </div>
        </div>
      )}
      {/* MODALE GENERIQUE AJOUT / MODIFICATION */}
      {resourceModal.type && (() => {
        const config = RESOURCE_CONFIGS[resourceModal.type];
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={closeResourceModal}>
            <div className="glass-card w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-3xl p-7 space-y-5 relative" onClick={e => e.stopPropagation()}>
              <button onClick={closeResourceModal} className="absolute top-5 right-5 text-stone-400 hover:text-stone-700"><X className="w-5 h-5" /></button>
              <div><h3 className="font-serif text-xl font-bold">{resourceModal.editingId !== null ? `Modifier : ${config.titleSingular}` : config.addLabel}</h3><p className="text-xs text-stone-500 mt-1">Les champs marqués d'un * sont obligatoires.</p></div>
              <div className="space-y-3">{config.fields.map(field => (
                <div key={field.key} className="space-y-1.5"><label className="text-xs font-semibold text-stone-600">{field.label}{field.required ? ' *' : ''}</label>

          <div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl space-y-6">
            <h2 className="font-serif text-3xl font-bold text-stone-900">Contact</h2>
            <p className="text-stone-600 text-sm">Secrétariat de la Conférence des Grandes Écoles — ARSTM, Abidjan, Côte d'Ivoire.</p>
          </div>
        )}

        {/* ESPACE MEMBRE VIEW */}
        {activeTab === 'espace-membre' && currentUser && (
          <div className="max-w-xl mx-auto glass-card p-8 rounded-3xl text-center space-y-6">
            <div className="w-16 h-16 mx-auto rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
              <UserCheck className="w-8 h-8 text-orange-600" />
            </div>
            <div>
              <h2 className="font-serif text-2xl font-bold text-stone-900">
                {isAdminLoggedIn ? currentUser.name : `Bonjour, ${currentUser.name}`}
              </h2>
              {!isAdminLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">{currentUser.role} — {currentUser.matricule}</p>
              )}
              {isAdminLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">Accès administrateur</p>
              )}
            </div>
            <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
              {!isAdminLoggedIn && (
                <button onClick={() => setShowChangePwd(true)} className="hover-scale inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30">
                  <Key className="w-4 h-4" /> Changer mon mot de passe
                </button>
              )}
              <button onClick={handleLogout} className="hover-scale inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-stone-900 text-white font-semibold">
                <LogOut className="w-4 h-4" /> Se déconnecter
              </button>
            </div>
          </div>
        )}

      </main>

      {/* BARRE EN BAS : APPLE LIQUID GLASS DOCK */}
      <div className="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
        <nav
          ref={navRef}
          onMouseLeave={() => setHoveredTab(null)}
          className="pointer-events-auto relative glass-dock p-2 rounded-full flex items-center gap-1 max-w-full overflow-x-auto no-scrollbar"
        >
          <div
            className="absolute top-2 bottom-2 liquid-pill rounded-full pointer-events-none"
            style={{
              left: `${pillStyle.left}px`,
              width: `${pillStyle.width}px`,
              opacity: pillStyle.opacity,
            }}
          />

          {navItems.map(item => {
            const Icon = item.icon;
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                data-tab={item.id}
                onClick={() => setActiveTab(item.id)}
                onMouseEnter={() => setHoveredTab(item.id)}
                className={`relative z-10 flex items-center gap-2 px-4 py-3 rounded-full text-xs font-bold transition-transform duration-300 transform hover:scale-110 active:scale-95 whitespace-nowrap ${
                  isActive || hoveredTab === item.id ? 'text-white' : 'text-stone-700 hover:text-stone-950'
                }`}
              >
                <Icon className="w-4 h-4" />
                <span className="hidden sm:inline">{item.label}</span>
              </button>
            );
          })}
        </nav>
      </div>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
