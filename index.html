<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: linear-gradient(180deg, #e9f1f7 0%, #f3f6f6 35%, #fbf7ee 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  /* Effet Liquid Glass */
  .glass-card {
    background: rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }

  .glass-dock {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(25px) saturate(200%);
    -webkit-backdrop-filter: blur(25px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 30px 60px rgba(234, 88, 12, 0.12), 0 10px 25px rgba(0, 0, 0, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.9);
  }

  .liquid-pill {
    background: linear-gradient(135deg, rgba(234, 88, 12, 0.9) 0%, rgba(249, 115, 22, 0.85) 100%);
    box-shadow: 0 8px 20px rgba(234, 88, 12, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(10px);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Animations de survol */
  .hover-scale {
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  }
  .hover-scale:hover {
    transform: translateY(-4px) scale(1.04);
  }

  /* Cartes : survol plus doux (léger soulèvement + ombre orangée, sans gros zoom) */
  .glass-card.hover-scale { transition: transform 0.3s ease, box-shadow 0.3s ease; }
  .glass-card.hover-scale:hover { transform: translateY(-4px); box-shadow: 0 26px 55px rgba(234, 88, 12, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.8); }
  /* Boutons et liens : changements de couleur en douceur */
  button, a { transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, opacity 0.25s ease; }

  /* Fondu rapide quand on change de rubrique */
  @keyframes tabFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tab-fade { animation: tabFade 0.3s ease-out; }

  /* Apparition douce des cartes au défilement */
  .reveal { opacity: 0; transform: translateY(18px); }
  .glass-card.reveal { transition: opacity 0.55s ease-out, transform 0.55s ease-out; transition-delay: var(--reveal-delay, 0ms); }
  .reveal.is-visible { opacity: 1; transform: none; }

  /* Vague très lente sous le titre de l'accueil */
  .wave-layer { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; overflow: hidden; pointer-events: none; z-index: 0; }
  .wave-layer svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; }
  @keyframes waveSlide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .wave-a { animation: waveSlide 18s linear infinite; }
  .wave-b { animation: waveSlide 28s linear infinite reverse; }

  /* Rose des vents du fond : rotation lente et continue (un tour en 100 s) */
  @keyframes compassSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .compass-spin { transform-origin: 0 0; animation: compassSpin 100s linear infinite; will-change: transform; }

  /* Le bateau de l'accueil tangue très légèrement (la mer, elle, ne bouge pas) */
  @keyframes shipBob {
    from { transform: rotate(-0.5deg) translateY(0.5px); }
    to   { transform: rotate(0.5deg) translateY(-1px); }
  }
  .ship-bob { transform-origin: 270px 176px; animation: shipBob 7s ease-in-out infinite alternate; }

  /* Fenêtres (connexion, formulaires, confirmations) : ouverture en fondu avec léger zoom */
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: none; } }
  .fixed.inset-0.z-50 { animation: overlayIn 0.2s ease-out; }
  .fixed.inset-0.z-50 > .glass-card, .fixed.inset-0.z-50 > [role="dialog"], .fixed.inset-0.z-50 > [role="alertdialog"] { animation: modalIn 0.25s ease-out; }

  /* Route maritime du fond : les pointillés avancent doucement, la balise pulse */
  @keyframes routeFlow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -12; } }
  .route-flow { animation: routeFlow 2.4s linear infinite; }
  @keyframes routePulse { 0% { transform: scale(1); opacity: 0.45; } 100% { transform: scale(3.2); opacity: 0; } }
  .route-pulse { transform-box: fill-box; transform-origin: center; animation: routePulse 3.2s ease-out infinite; }

  /* Écran de chargement : visible tant que le site démarre */
  #splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; font-family: Inter, system-ui, sans-serif; }
  #splash img { width: 84px; height: auto; animation: splashPulse 2.4s ease-in-out infinite; }
  #splash .splash-title { margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 1.7rem; color: #1c1917; letter-spacing: 0.02em; }
  #splash .splash-bar { width: min(220px, 60vw); height: 4px; border-radius: 999px; background: rgba(234, 88, 12, 0.15); overflow: hidden; }
  #splash .splash-bar span { display: block; width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #EA580C, #F59E0B); animation: splashSlide 1.3s ease-in-out infinite; }
  #splash .splash-note { margin: 0; font-size: 0.8rem; color: #78716c; }
  #splash-slow { margin: 0; max-width: 20rem; font-size: 0.75rem; color: #78716c; opacity: 0; transition: opacity 0.6s ease; }
  @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
  @keyframes splashSlide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  /* Barre du bas : défilement horizontal sans barre visible */
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Contour visible au clavier (accessibilité) */
  button:focus-visible, a:focus-visible, [role="button"]:focus-visible { outline: 3px solid #EA580C; outline-offset: 2px; }

  /* Respect du réglage « réduire les animations » du téléphone / ordinateur */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    .hover-scale:hover, .glass-card.hover-scale:hover { transform: none; }
    .tab-fade, .wave-a, .wave-b, .compass-spin, .ship-bob, .route-flow, .route-pulse { animation: none; }
    #splash img { animation: none; }
    #splash .splash-bar span { animation: none; width: 100%; opacity: 0.5; }
    .fixed.inset-0.z-50, .fixed.inset-0.z-50 > .glass-card, .fixed.inset-0.z-50 > [role="dialog"], .fixed.inset-0.z-50 > [role="alertdialog"] { animation: none; }
    .reveal { opacity: 1; transform: none; }
  }
</style>

// ---------- Photos : réduction automatique avant envoi ----------
// Une photo de téléphone (3 à 8 Mo) est redimensionnée à 900 px max et compressée en JPEG (~80-150 Ko).
// Attention : utiliser window.Image (le constructeur du navigateur) et jamais un composant nommé « Image ».
const compressImage = (file, maxSize = 900, quality = 0.82) => new Promise((resolve, reject) => {
  if (!file || !file.type || !file.type.startsWith('image/')) { reject(new Error("Ce fichier n'est pas une image.")); return; }
  const url = URL.createObjectURL(file);
  const img = new window.Image();
  img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Format d'image non reconnu par le navigateur (essayez une photo JPG ou PNG).")); };
  img.onload = () => {
    try {
      const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); // fond blanc pour les PNG transparents
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    } catch (err) {
      reject(new Error("Impossible de préparer cette photo : " + err.message));
    } finally {
      URL.revokeObjectURL(url);
    }
  };
  img.src = url;
});

// Message d'erreur affiché quand une photo est refusée
const photoErrorMessage = (file, err) => (/heic|heif/i.test((file && (file.type || file.name)) || '')
  ? "format HEIC (iPhone) non lisible par ce navigateur. Envoyez la photo en JPG ou faites une capture d'écran de la photo."
  : err.message);

// Traduit les erreurs Supabase en message compréhensible
const SQL_SCRIPT_NAME = 'supabase_securite_evo36.sql';
const explainDbError = (error) => {
  if (!error) return '';
  const msg = String(error.message || error);
  const code = String(error.code || '');
  if (code === 'PGRST202' || /Could not find the function/i.test(msg))
    return `le script de sécurité n'est pas encore installé dans Supabase. Lancez ${SQL_SCRIPT_NAME} dans Supabase > SQL Editor.`;
  if (code === '28000') return "votre session a expiré. Reconnectez-vous.";
  if (code === '42501') return "action non autorisée pour votre compte.";
  // Messages rédigés en français par le serveur (validation, fiche introuvable...)
  if (code === '22023' || code === 'P0001' || code === 'P0002') return msg;
  if (code === 'PGRST204' || code === '42703' || /column .* (does not exist|of .* in the schema cache)/i.test(msg))
    return `la base Supabase n'est pas à jour (colonne manquante). Lancez ${SQL_SCRIPT_NAME} dans Supabase > SQL Editor. Détail : ` + msg;
  if (code === '23502') return "un champ obligatoire est vide. Détail : " + msg;
  if (code === '23505') return "ce matricule est déjà utilisé par une autre fiche.";
  if (code === '57014' || /statement timeout/i.test(msg)) return "le serveur a mis trop de temps à répondre (photos trop lourdes ?). Réessayez.";
  if (/payload|too large|413|request entity/i.test(msg)) return "la photo est trop lourde. Choisissez une image plus petite.";
  if (/Failed to fetch|NetworkError|network/i.test(msg)) return "connexion à Supabase impossible. Vérifiez votre connexion internet et réessayez.";
  return msg;
};

// ---------- Compte à rebours des actualités ----------
// Le choix « avec compte à rebours » est gardé dans le texte de la date (suffixe), puis retiré à l'affichage.
const CD_MARK = ' [compte à rebours]';
const splitCountdown = (raw) => {
  const t = String(raw || '');
  return t.endsWith(CD_MARK) ? { text: t.slice(0, -CD_MARK.length), flag: true } : { text: t, flag: false };
};
const FR_MONTHS = ['jan', 'fev', 'mar', 'avr', 'mai', 'juin', 'juil', 'aou', 'sep', 'oct', 'nov', 'dec'];
// Lit « 24 Septembre 2026 », « 24 Septembre 2026 à 18h30 » ou « 24/09/2026 18:30 ». Sans heure : début de la journée.
const parseFrenchDate = (raw) => {
  const t = String(raw || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  let d, mo, y, rest;
  let m = t.match(/(\d{1,2})(?:er)?\s+([a-z]+)\.?\s+(\d{4})(.*)$/);
  if (m) {
    mo = FR_MONTHS.findIndex(p => m[2].startsWith(p));
    d = +m[1]; y = +m[3]; rest = m[4];
  } else {
    m = t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(.*)$/);
    if (!m) return null;
    d = +m[1]; mo = +m[2] - 1; y = +m[3]; rest = m[4];
  }
  const tm = rest.match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/);
  const hh = tm ? +tm[1] : 0;
  const mi = tm && tm[2] ? +tm[2] : 0;
  if (mo < 0 || mo > 11 || d < 1 || d > 31 || hh > 23 || mi > 59) return null;
  const dt = new Date(y, mo, d, hh, mi, 0);
  if (dt.getMonth() !== mo) return null; // date impossible (ex. 30 février)
  return { date: dt, hasTime: !!tm };
};
// En jours, puis en heures et minutes quand il reste moins de 24 h
const countdownInfo = (rawDate, now) => {
  const p = parseFrenchDate(splitCountdown(rawDate).text);
  if (!p) return null;
  const DAY = 86400000, HOUR = 3600000, MIN = 60000;
  const ms = p.date.getTime() - now;
  if (ms <= 0) return (!p.hasTime && now < p.date.getTime() + DAY) ? { text: "C'est aujourd'hui" } : null;
  if (ms >= 2 * DAY) return { text: `Dans ${Math.floor(ms / DAY)} jours` };
  if (ms >= DAY) return { text: 'Dans 1 jour' };
  const h = Math.floor(ms / HOUR), mn = Math.floor((ms % HOUR) / MIN);
  if (h >= 1) return { text: `Dans ${h} h ${String(mn).padStart(2, '0')} min` };
  return { text: `Dans ${Math.max(1, mn)} min` };
};
const CountdownPill = ({ date }) => {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const id = setInterval(() => setNow(Date.now()), 30000); return () => clearInterval(id); }, []);
  const info = countdownInfo(date, now);
  if (!info) return null;
  return (
    <span className="inline-flex items-center gap-1.5 bg-orange-600 text-white px-3 py-1 rounded-full text-[11px] font-bold">
      <Clock className="w-3.5 h-3.5" /> {info.text}
    </span>
  );
};

function App() {
  const [activeTab, setActiveTab] = useState('accueil');
  const [hoveredTab, setHoveredTab] = useState(null);
  const [toast, setToast] = useState(null);
  const [loginError, setLoginError] = useState('');
  const toastTimerRef = useRef(null);

  // Session : délivrée et vérifiée par le serveur (fonction cge_login). Le navigateur ne fait
  // qu'afficher ou masquer des boutons ; chaque écriture est re-contrôlée côté Supabase.
  const [session, setSession] = useState(null);
  const currentUser = session;
  const isAdminLoggedIn = !!session && session.role === 'admin';
  const isSecretariatLoggedIn = !!session && session.role === 'secretariat';

  const isStaffLoggedIn = isAdminLoggedIn || isSecretariatLoggedIn;
  const isUserAuthenticated = session !== null;

  // Historique des actions (admins & secrétariat) — écrit par le serveur, lecture seule pour les admins
  const [activityLog, setActivityLog] = useState([]);
  const [isLoadingLog, setIsLoadingLog] = useState(false);
  const [logFilterActor, setLogFilterActor] = useState('Tous');
  const [logFilterAction, setLogFilterAction] = useState('Toutes');
  // « J'aime » : { [id de l'actualité]: { count, mine } }
  const [likes, setLikes] = useState({});
  const [pendingLikes, setPendingLikes] = useState({});
  const [showMemberModal, setShowMemberModal] = useState(false);
  const [memberMatriculeInput, setMemberMatriculeInput] = useState('');
  const [memberPinInput, setMemberPinInput] = useState('');
  const [isCheckingLogin, setIsCheckingLogin] = useState(false);

  // Gestion admin des membres du bureau
  const [showAddMemberModal, setShowAddMemberModal] = useState(false);
  const [editingMemberId, setEditingMemberId] = useState(null);
  const [memberToDelete, setMemberToDelete] = useState(null);
  const emptyMemberForm = { name: '', role: '', department: 'presidence', position: 'chef', matricule: '', bio: '', pin: '', image: '' };
  const [newMemberForm, setNewMemberForm] = useState(emptyMemberForm);

  // Espace Admin / comptes de connexion des membres
  const [adminSearchQuery, setAdminSearchQuery] = useState('');

  const [newAccountForm, setNewAccountForm] = useState({ matricule: '', name: '', password: '' });
  const [isAddingAccount, setIsAddingAccount] = useState(false);
  const [showChangePwd, setShowChangePwd] = useState(false);
  const [pwdForm, setPwdForm] = useState({ current: '', next: '', confirm: '' });
  const [pwdError, setPwdError] = useState('');
  const [isChangingPwd, setIsChangingPwd] = useState(false);

  // Gestion admin générique
  const [resourceModal, setResourceModal] = useState({ type: null, editingId: null });
  const [resourceForm, setResourceForm] = useState({});
  // Candidature en ligne (formulaire envoyé par email via FormSubmit)
  const [applyJob, setApplyJob] = useState(null);
  // Espace CV et candidatures (CV du membre, lettres reçues par le secrétariat)
  const [myCv, setMyCv] = useState(null);
  const [cvBusy, setCvBusy] = useState(false);
  const [applications, setApplications] = useState([]);
  const [cgeApplyJob, setCgeApplyJob] = useState(null);
  const [cgeLetter, setCgeLetter] = useState(null);
  const [cgeApplyError, setCgeApplyError] = useState('');
  const [cgeSending, setCgeSending] = useState(false);
  const [applyStatus, setApplyStatus] = useState('idle'); // idle | sending | sent
  const [applyError, setApplyError] = useState('');
  const applyTimerRef = useRef(null);
  const [resourcePhotoStatus, setResourcePhotoStatus] = useState('');
  const [isSavingResource, setIsSavingResource] = useState(false);
  const [resourceToDelete, setResourceToDelete] = useState(null);
  const [isDeleting, setIsDeleting] = useState(false);

  // Navigation Ref
  const navRef = useRef(null);
  const [pillStyle, setPillStyle] = useState({ left: 0, width: 0, opacity: 0 });
  const [viewportTick, setViewportTick] = useState(0);

  // Data Stores
  const [members, setMembers] = useState(initialMembers);
  // null = pas encore chargé ; 'ok' = données Supabase ; sinon texte de l'erreur
  const [bureauSync, setBureauSync] = useState(null);
  const [news, setNews] = useState(initialNews);
  const [jobs, setJobs] = useState([]);
  const [alumni, setAlumni] = useState([]);
  const [gallery, setGallery] = useState(initialGallery);
  const [events, setEvents] = useState(initialEvents);
  const [registre, setRegistre] = useState([]);
  const [contacts, setContacts] = useState(initialContacts);
  const [registreFilter, setRegistreFilter] = useState('Tous');
  const [registreSearch, setRegistreSearch] = useState('');
  const [registrePromo, setRegistrePromo] = useState('Toutes');
  const [isSyncing, setIsSyncing] = useState(false);

  const mapMemberRow = (row) => ({ id: row.id, matricule: row.matricule || null, name: row.name, role: row.role, department: row.department, position: row.position, bio: row.bio, image: row.image });

  const RESOURCE_STATE = { news: [news, setNews], jobs: [jobs, setJobs], events: [events, setEvents], alumni: [alumni, setAlumni], registre: [registre, setRegistre], contacts: [contacts, setContacts], gallery: [gallery, setGallery] };

  // ---------- Notifications ----------
  const showToastMsg = (msg, type = 'success') => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ msg, type });
    toastTimerRef.current = setTimeout(() => setToast(null), type === 'error' ? 7000 : 3500);
  };

  // ---------- Session (gardée le temps de l'onglet, pour survivre à un rechargement) ----------
  const storeToken = (token) => {
    try { token ? sessionStorage.setItem(SESSION_STORAGE_KEY, token) : sessionStorage.removeItem(SESSION_STORAGE_KEY); }
    catch (e) { /* stockage bloqué (navigation privée) : la session durera le temps de la page */ }
  };
  const readToken = () => { try { return sessionStorage.getItem(SESSION_STORAGE_KEY); } catch (e) { return null; } };
  const mapSession = (s, token) => s && ({
    token, role: s.role, login: s.login, name: s.name, matricule: s.matricule,
    memberRole: s.member_role, isPresident: !!s.is_president,
  });
  const clearSession = (message) => {
    storeToken(null);
    setSession(null);
    setActiveTab(t => (PRIVATE_TABS.includes(t) ? 'accueil' : t));
    if (message) showToastMsg(message, 'error');
  };

  // Appel d'une fonction serveur (RPC). Le serveur renvoie le code 28000 si la session n'est plus valable.
  const rpc = async (fn, args = {}) => {
    if (!supabaseClient) throw new Error("Serveur indisponible : vérifiez votre connexion internet puis rechargez la page.");
    const { data, error } = await supabaseClient.rpc(fn, args);
    if (error) {
      if (error.code === '28000') clearSession("Votre session a expiré. Reconnectez-vous.");
      throw error;
    }
    return data;
  };
  const authRpc = (fn, args = {}) => rpc(fn, { p_token: sessionToken, ...args });

  // ---------- Chargement initial (données publiques) ----------
  // Lecture du bureau. Si Supabase est trop lent (photos très lourdes : « statement timeout »),
  // on charge d'abord les fiches SANS les photos, puis chaque photo séparément.
  const fetchBureauRows = async () => {
    const full = await supabaseClient.from('bureau_members').select(BUREAU_PUBLIC_COLUMNS).order('id');
    const isTimeout = full.error && (full.error.code === '57014' || /statement timeout/i.test(full.error.message || ''));
    if (!isTimeout) return full;
    console.warn('Bureau : lecture lente, chargement des photos une par une.');
    const light = await supabaseClient.from('bureau_members').select('id, name, role, department, position, bio').order('id');
    if (light.error) return light;
    const rows = await Promise.all((light.data || []).map(async row => {
      const { data: one, error } = await supabaseClient.from('bureau_members').select('image').eq('id', row.id).maybeSingle();
      return { ...row, image: (!error && one) ? one.image : null };
    }));
    return { data: rows, error: null };
  };

  useEffect(() => {
    if (!supabaseClient) return;
    (async () => {
      setIsSyncing(true);
      try {
        const { data: memberRows, error: mErr } = await fetchBureauRows();
        if (mErr) { console.error('Chargement du bureau :', mErr.message); setBureauSync(explainDbError(mErr)); }
        else if (memberRows) {
          setBureauSync('ok');
          // garde les matricules déjà reçus si un admin s'est connecté pendant le chargement
          setMembers(prev => {
            const known = new Map(prev.filter(m => m.matricule).map(m => [m.id, m.matricule]));
            return memberRows.map(r => ({ ...mapMemberRow(r), matricule: known.get(r.id) || null }));
          });
        }
        for (const type of PUBLIC_TYPES) {
          const { table } = RESOURCE_CONFIGS[type];
          let query = supabaseClient.from(table).select('*').order('id');
          // Actualités : les visiteurs ne reçoivent que les actualités publiques
          if (type === 'news') query = query.or('visibility.is.null,visibility.eq.public');
          const { data: rows, error } = await query;
          if (error) console.error(`Chargement ${table} :`, error.message);
          else if (rows) RESOURCE_STATE[type][1](rows);
        }
      } catch (e) {
        console.error('Synchronisation Supabase :', e);
      } finally {
        setIsSyncing(false);
      }
    })();
    // Reprise de la session après un rechargement de la page
    const saved = readToken();
    if (saved) {
      rpc('cge_session', { p_token: saved })
        .then(s => { if (s) setSession(mapSession(s, saved)); else storeToken(null); })
        .catch(e => { console.error('Reprise de session :', e.message); storeToken(null); });
    }
  }, []);

  // Apparition douce des cartes au défilement (rien si « réduire les animations » est activé)
  useEffect(() => {
    if (typeof window === 'undefined' || !('IntersectionObserver' in window) || prefersReducedMotion()) return;
    const main = document.querySelector('main');
    if (!main) return;
    const timers = [];
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        io.unobserve(el);
        el.classList.add('is-visible');
        timers.push(setTimeout(() => { el.classList.remove('reveal', 'is-visible'); el.style.removeProperty('--reveal-delay'); }, 1100));
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    const prepare = () => {
      main.querySelectorAll('.glass-card').forEach(el => {
        if (el.dataset.revealed) return;
        el.dataset.revealed = '1';
        if (el.closest('.fixed, [role="dialog"], [role="alertdialog"]')) return;
        if (el.parentElement && el.parentElement.closest('.glass-card')) return;
        if (el.getBoundingClientRect().top < window.innerHeight * 0.92) return; // déjà à l'écran : pas d'effet
        const idx = Array.prototype.indexOf.call(el.parentElement.children, el);
        el.style.setProperty('--reveal-delay', Math.min(idx, 4) * 80 + 'ms');
        el.classList.add('reveal');
        io.observe(el);
      });
    };
    prepare();
    const mo = new MutationObserver(prepare);
    mo.observe(main, { childList: true, subtree: true });
    return () => { io.disconnect(); mo.disconnect(); timers.forEach(clearTimeout); };
  }, [activeTab]);

  // Droits de modification (affichage) : admin = tout ; secrétariat = Contact, Médiathèque, Registre.
  const canEdit = (type) => isAdminLoggedIn || (isSecretariatLoggedIn && SECRETARIAT_EDITABLE.includes(type));

  // ---------- Actualités réservées aux membres ----------
  const isMembersNews = (n) => n.visibility === 'membres';
  const publicNews = news.filter(n => !isMembersNews(n));
  const membersNews = news.filter(isMembersNews);

  // ---------- Données réservées (chargées via le serveur après connexion) ----------
  const loadPrivateData = async () => {
    for (const [kind, setter] of [['registre', setRegistre], ['alumni', setAlumni], ['jobs', setJobs]]) {
      try { setter((await authRpc('cge_list', { p_kind: kind })) || []); }
      catch (e) { console.error(`Chargement ${kind} :`, e.message); }
    }
    try {
      const rows = (await authRpc('cge_list', { p_kind: 'news_membres' })) || [];
      setNews(prev => {
        const ids = new Set(prev.map(n => n.id));
        return [...prev, ...rows.filter(n => !ids.has(n.id))];
      });
    } catch (e) { console.error('Actualités membres :', e.message); }
  };

  const loadLikes = async (token) => {
    if (!supabaseClient) return;
    try {
      const rows = await rpc('cge_likes', { p_token: token });
      const map = {};
      (rows || []).forEach(r => { map[String(r.news_id)] = { count: Number(r.count) || 0, mine: !!r.mine }; });
      setLikes(map);
    } catch (e) { console.error('Chargement des J’aime :', e.message); }
  };

  const loadActivityLog = async (showErrors = false) => {
    setIsLoadingLog(true);
    try { setActivityLog((await authRpc('cge_list', { p_kind: 'activity_log' })) || []); }
    catch (e) {
      if (showErrors) showToastMsg("Impossible de charger l'historique : " + explainDbError(e), 'error');
      else console.error('Chargement historique :', e.message);
    } finally { setIsLoadingLog(false); }
  };
  const refreshLog = () => loadActivityLog(true);

  const loadAccounts = async (showErrors = false) => {
    setIsLoadingAccounts(true);
    try { setAccounts((await authRpc('cge_admin_accounts')) || []); }
    catch (e) {
      if (showErrors) showToastMsg("Impossible de charger les comptes : " + explainDbError(e), 'error');
      else console.error('Chargement des comptes :', e.message);
    } finally { setIsLoadingAccounts(false); }
  };

  // Les matricules du bureau ne sont pas publics : l'admin les reçoit séparément pour le formulaire.
  const loadBureauMatricules = async () => {
    try {
      const rows = (await authRpc('cge_list', { p_kind: 'bureau_matricules' })) || [];
      const byId = new Map(rows.map(r => [r.id, r.matricule]));
      setMembers(prev => prev.map(m => (byId.has(m.id) ? { ...m, matricule: byId.get(m.id) } : m)));
    } catch (e) { console.error('Matricules du bureau :', e.message); }
  };

  useEffect(() => {
    if (!sessionToken) {
      // Déconnecté : on efface tout ce qui était réservé
      setNews(prev => prev.filter(n => !isMembersNews(n)));
      setRegistre([]); setAlumni([]); setJobs([]);
      setActivityLog([]); setAccounts([]);
      setMembers(prev => prev.map(m => ({ ...m, matricule: null })));
      loadLikes(null);
      return;
    }
    loadPrivateData();
    loadLikes(sessionToken);
    if (session.role === 'admin') { loadActivityLog(); loadAccounts(); loadBureauMatricules(); }
  }, [sessionToken]);

  // ---------- Système de « J'aime » (réservé aux personnes connectées) ----------
  const likeCount = (newsId) => (likes[String(newsId)] || {}).count || 0;
  const hasLiked = (newsId) => !!(likes[String(newsId)] || {}).mine;

  const toggleLike = async (item) => {
    if (!isUserAuthenticated) {
      showToastMsg("Connectez-vous à votre espace membre pour aimer une actualité.", 'error');
      setShowMemberModal(true);
      return;
    }
    const key = String(item.id);
    if (pendingLikes[key]) return;
    const before = likes[key] || { count: 0, mine: false };
    setPendingLikes(p => ({ ...p, [key]: true }));
    // mise à jour immédiate à l'écran
    setLikes(l => ({ ...l, [key]: { count: Math.max(0, before.count + (before.mine ? -1 : 1)), mine: !before.mine } }));
    try {
      const res = await authRpc('cge_toggle_like', { p_news_id: item.id });
      setLikes(l => ({ ...l, [key]: { count: Number(res.count) || 0, mine: !!res.liked } }));
    } catch (e) {
      setLikes(l => ({ ...l, [key]: before }));
      showToastMsg("Impossible d'enregistrer votre J'aime : " + explainDbError(e), 'error');
    } finally {
      setPendingLikes(p => { const n = { ...p }; delete n[key]; return n; });
    }
  };

  // ---------- Historique (journal d'activité) ----------
  const itemLabel = (item) => (item && (item.title || item.name || item.label)) || '';
  const describeChanges = (fields, before, after) => {
    const changed = fields.filter(f => String((before || {})[f.key] ?? '') !== String((after || {})[f.key] ?? ''));
    if (!changed.length) return 'Aucun champ modifié';
    return 'Champs modifiés : ' + changed.map(f => {
      const short = f.label.replace(/\s*\(.*\)\s*$/, '');
      if (f.type === 'image') return short;
      const oldV = String((before || {})[f.key] ?? '').slice(0, 60) || '∅';
      const newV = String((after || {})[f.key] ?? '').slice(0, 60) || '∅';
      return `${short} (« ${oldV} » → « ${newV} »)`;
    }).join(' ; ');
  };

  const formatLogDate = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  };
  const logActors = ['Tous', ...Array.from(new Set(activityLog.map(l => `${l.actor_name} (${l.actor_login})`)))];
  const logActions = ['Toutes', ...Array.from(new Set(activityLog.map(l => l.action)))];
  const filteredLog = activityLog.filter(l =>
    (logFilterActor === 'Tous' || `${l.actor_name} (${l.actor_login})` === logFilterActor) &&
    (logFilterAction === 'Toutes' || l.action === logFilterAction)
  );
  const actionBadge = (a) => ({
    'Connexion': 'bg-emerald-500/10 text-emerald-700 border-emerald-500/20',
    'Déconnexion': 'bg-stone-500/10 text-stone-600 border-stone-400/30',
    'Échec de connexion': 'bg-rose-500/10 text-rose-700 border-rose-500/30',
    'Ajout': 'bg-sky-500/10 text-sky-700 border-sky-500/20',
    'Modification': 'bg-amber-500/10 text-amber-700 border-amber-500/30',
    'Suppression': 'bg-rose-500/10 text-rose-700 border-rose-500/30',
    'Réinitialisation mot de passe': 'bg-violet-500/10 text-violet-700 border-violet-500/20',
    'Création de compte': 'bg-violet-500/10 text-violet-700 border-violet-500/20',
    'Changement de mot de passe': 'bg-violet-500/10 text-violet-700 border-violet-500/20',
  }[a] || 'bg-orange-500/10 text-orange-700 border-orange-500/20');
  const afterStaffWrite = () => { if (isAdminLoggedIn) loadActivityLog(); };

  const registreCounts = {
    'Tous': registre.length,
    'Membre actuel': registre.filter(p => p.status === 'Membre actuel').length,
    'Ancien membre': registre.filter(p => p.status === 'Ancien membre').length,
  };
  const registrePromos = Array.from(new Set(registre.map(p => String(p.promo || '').trim()).filter(Boolean)))
    .sort((a, b) => b.localeCompare(a, 'fr', { numeric: true }));
  const filteredRegistre = registre
    .filter(p => registreFilter === 'Tous' || p.status === registreFilter)
    .filter(p => registrePromo === 'Toutes' || String(p.promo || '').trim() === registrePromo)

  // Liens : accepte seulement http(s) avec un vrai nom de domaine (ex. www.exemple.ci) ; ajoute https:// si oublié.
  // Attention : le navigateur transforme « appeler Jean » en https://appeler%20jean/ au lieu de le refuser.
  const normalizeUrl = (value) => {
    const v = String(value || '').trim();
    if (!v) return '';
    if (/\s/.test(v)) return null;
    const withScheme = /^[a-z][a-z0-9+.-]*:/i.test(v) ? v : `https://${v}`;
    try {
      const u = new URL(withScheme);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
      if (u.username || u.password) return null;
      if (!/^([a-z0-9-]+\.)+[a-z0-9-]{2,}$/i.test(u.hostname)) return null;
      return u.href;
    } catch { return null; }
  };

  const MAX_APPLY_BYTES = 9.5 * 1024 * 1024; // limite FormSubmit : 10 Mo pour toutes les pièces jointes

  // ---------- CV du membre et candidatures (fonctions serveur du script supabase_candidatures.sql) ----------

  const fmtDate = (d) => { try { return new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } };

    if (!file) return reject(new Error('Aucun fichier choisi.'));
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) return reject(new Error('Le fichier doit être un PDF.'));
    if (file.size > MAX_PDF_BYTES) return reject(new Error(`Fichier trop lourd (${(file.size / 1048576).toFixed(1)} Mo) : maximum 2 Mo.`));
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(new Error('Lecture du fichier impossible.'));
    r.readAsDataURL(file);
  });
  const downloadBase64Pdf = (b64, filename) => {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename || 'document.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  };

    const val = (n) => String((form.elements[n] && form.elements[n].value) || '').trim();

    if (!EMAIL_RE.test(val('email'))) return fail('Indiquez une adresse email valide : la réponse vous sera envoyée à cette adresse.');
    if (val('Téléphone').replace(/[^\d]/g, '').length < 8) return fail('Indiquez un numéro de téléphone valide.');
    let total = 0;
    for (const input of form.querySelectorAll('input[type=file]')) {
      const f = input.files && input.files[0];
      if (!f) return fail(`Ajoutez le fichier demandé : « ${input.dataset.label} ».`);

    }
    if (total > MAX_APPLY_BYTES) return fail(`Vos fichiers pèsent ${(total / 1048576).toFixed(1)} Mo au total : le maximum est 9,5 Mo. Envoyez des PDF plus légers.`);
    for (const t of form.querySelectorAll('textarea[data-required]')) {

        closeAddMemberModal();
        showToastMsg(ok
          ? "Cette fiche n'existe plus dans Supabase (la page affichait d'anciennes données). La liste vient d'être rechargée : rouvrez la fiche et recommencez."
          : "La page n'arrive pas à lire la liste du bureau dans Supabase. Voir l'encadré rouge en haut de la page Membres.", 'error');
        return;
      }
      showToastMsg(`Impossible ${isEditing ? 'de modifier' : "d'enregistrer"} ce membre : ${explainDbError(err)}`, 'error');
    } finally {
      setIsSavingMember(false);
    }
  };

  const handleDeleteMember = async (member) => {
    if (isDeleting) return;
    setIsDeleting(true);
    try {
      await authRpc('cge_delete', { p_table: 'bureau_members', p_id: member.id, p_details: `${member.name} (${member.role}${member.matricule ? ', ' + member.matricule : ''})` });
      showToastMsg(`${member.name} a été retiré(e) du bureau.`, 'success');
      afterStaffWrite();
    } catch (err) {
      if (err.code !== 'P0002') { showToastMsg("Impossible de retirer ce membre : " + explainDbError(err), 'error'); return; }
      showToastMsg(`${member.name} avait déjà été retiré(e) du bureau.`, 'success');
    } finally {
      setIsDeleting(false);
    }
    setMembers(prev => prev.filter(m => m.id !== member.id));
    setMemberToDelete(null);
  };

  // ---------- Rubriques (actualités, offres, événements, alumni, registre, contacts, médiathèque) ----------
  const openAddResource = (type) => {
    const config = RESOURCE_CONFIGS[type];
    const blank = {};
    config.fields.forEach(f => { blank[f.key] = f.type === 'select' ? optValue(f.options[0]) : ''; });
    setResourcePhotoStatus('');
    setResourceForm(blank);
    setResourceModal({ type, editingId: null });
  };

  const openEditResource = (type, item) => {
    const config = RESOURCE_CONFIGS[type];
    const values = {};
    config.fields.forEach(f => { values[f.key] = item[f.key] || (f.type === 'select' ? optValue(f.options[0]) : ''); });
    if (config.fields.some(f => f.type === 'countdown')) { const sp = splitCountdown(item.date); values.date = sp.text; values.countdown = sp.flag; }
    setResourcePhotoStatus('');
    setResourceForm(values);
    setResourceModal({ type, editingId: item.id });
  };

  const closeResourceModal = () => {
    setResourceModal({ type: null, editingId: null });
    setResourceForm({});
    setResourcePhotoStatus('');
  };

  const handleResourceImageUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // permet de re-choisir la même photo
    if (!file) return;
    setResourcePhotoStatus(`Préparation de la photo (${Math.round(file.size / 1024)} Ko)…`);
    try {
      const dataUrl = await compressImage(file);
      setResourceForm(f => ({ ...f, image: dataUrl }));
      setResourcePhotoStatus(`Photo prête (${Math.round(dataUrl.length * 0.75 / 1024)} Ko).`);
    } catch (err) {
      console.error('Photo :', err);
      setResourcePhotoStatus('');
      showToastMsg("Photo refusée : " + photoErrorMessage(file, err), 'error');
    }
  };

  const handleSaveResource = async () => {
    if (isSavingResource) return;
    const { type, editingId } = resourceModal;
    if (!canEdit(type)) { showToastMsg("Vous n'avez pas le droit de modifier cette rubrique.", 'error'); return; }
    const config = RESOURCE_CONFIGS[type];
    const [items, setter] = RESOURCE_STATE[type];

    for (const f of config.fields) {
      if (f.required && !String(resourceForm[f.key] || '').trim()) {
        showToastMsg(`Le champ « ${f.label} » est obligatoire.`, 'error');
        return;
      }
    }

    const payload = {};
    config.fields.forEach(f => { payload[f.key] = typeof resourceForm[f.key] === 'string' ? resourceForm[f.key].trim() : resourceForm[f.key]; });
    if (type === 'news') {
      const pd = parseFrenchDate(payload.date);
      payload.date = payload.date + (payload.countdown && pd && pd.date.getTime() > Date.now() ? CD_MARK : '');
    }
    delete payload.countdown;
    for (const f of config.fields) {
      if (f.type === 'url' && payload[f.key]) {
        const clean = normalizeUrl(payload[f.key]);
        if (!clean) { showToastMsg(`Le lien « ${payload[f.key]} » n'est pas valide. Exemple : https://www.exemple.com`, 'error'); return; }
        payload[f.key] = clean;
      }
      if (f.type === 'apply' && payload[f.key]) {
        const clean = normalizeApply(payload[f.key]);
        if (!clean) { showToastMsg(`« ${payload[f.key]} » n'est ni un lien valide ni une adresse email. Exemples : https://www.exemple.com ou recrutement@exemple.com`, 'error'); return; }
        payload[f.key] = clean;
      }
    }

    const isEditing = editingId !== null;
    const before = isEditing ? items.find(i => i.id === editingId) : null;
    const details = isEditing
      ? `${itemLabel(payload) || itemLabel(before)} — ${describeChanges(config.fields, before, payload)}`
      : itemLabel(payload);

    setIsSavingResource(true);
    try {
      const row = await authRpc('cge_save', { p_table: config.table, p_id: editingId, p_data: payload, p_details: details });
      setter(prev => (isEditing ? prev.map(i => (i.id === editingId ? row : i)) : [...prev, row]));
      closeResourceModal();
      showToastMsg(`${config.titleSingular} ${isEditing ? 'modifié(e)' : 'ajouté(e)'} avec succès.`, 'success');
      afterStaffWrite();
    } catch (err) {
      showToastMsg(`Impossible d'enregistrer ${config.label} : ` + explainDbError(err), 'error');
    } finally {
      setIsSavingResource(false);
    }
  };

  const handleDeleteResource = async () => {
    if (!resourceToDelete || isDeleting) return;
    const { type, item } = resourceToDelete;
    if (!canEdit(type)) { showToastMsg("Vous n'avez pas le droit de modifier cette rubrique.", 'error'); setResourceToDelete(null); return; }
    const config = RESOURCE_CONFIGS[type];
    const [, setter] = RESOURCE_STATE[type];
    setIsDeleting(true);
    try {
      await authRpc('cge_delete', { p_table: config.table, p_id: item.id, p_details: itemLabel(item) });
      showToastMsg(`${config.titleSingular} supprimé(e) avec succès.`, 'success');
      afterStaffWrite();
    } catch (err) {
      if (err.code !== 'P0002') { showToastMsg(`Impossible de supprimer ${config.label} : ` + explainDbError(err), 'error'); return; }
      showToastMsg(`${config.titleSingular} déjà supprimé(e).`, 'success');
    } finally {
      setIsDeleting(false);
    }
    setter(prev => prev.filter(i => i.id !== item.id));
    setResourceToDelete(null);
  };

  // Fermeture de la fenêtre ouverte avec la touche Échap
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (resetModalMember) setResetModalMember(null);
      else if (showAddAccount) closeAddAccount();
      else if (showChangePwd) closeChangePwd();
      else if (memberToDelete) setMemberToDelete(null);
      else if (resourceToDelete) setResourceToDelete(null);
      else if (resourceModal.type) closeResourceModal();
      else if (showAddMemberModal) closeAddMemberModal();
      else if (showMemberModal) closeMemberModal();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  // Recherche dans les comptes (espace admin)
  const accountQuery = adminSearchQuery.trim().toLowerCase();
  const filteredAccounts = accounts.filter(a =>
    String(a.name || '').toLowerCase().includes(accountQuery) ||
    String(a.matricule || '').toLowerCase().includes(accountQuery)
  );

  // ---------- Bureau Exécutif : éléments d'affichage ----------
  const memberInitials = (name) => String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const renderMemberPhoto = (m, sizeClass) => m.image ? (
    <img src={m.image} alt={m.name} loading="lazy" decoding="async" className={`w-full ${sizeClass} object-cover object-top`} />
  ) : (
    <div className={`w-full ${sizeClass} bg-gradient-to-br from-orange-500/15 to-amber-500/10 flex items-center justify-center`}>
      <span className="font-serif text-4xl font-bold text-orange-600/70">{memberInitials(m.name)}</span>
    </div>
  );
  const renderMemberAdminButtons = (m) => isAdminLoggedIn && (
    <div className="absolute top-3 right-3 z-10 flex gap-2">
      <button onClick={() => openEditMemberModal(m)} aria-label={`Modifier ${m.name}`} className="w-9 h-9 rounded-full bg-white/90 backdrop-blur border border-white/70 flex items-center justify-center text-orange-600 hover:bg-orange-600 hover:text-white transition duration-200"><Pencil className="w-4 h-4" /></button>
      <button onClick={() => setMemberToDelete(m)} aria-label={`Retirer ${m.name}`} className="w-9 h-9 rounded-full bg-white/90 backdrop-blur border border-white/70 flex items-center justify-center text-rose-600 hover:bg-rose-600 hover:text-white transition duration-200"><Trash className="w-4 h-4" /></button>
    </div>
  );
  const renderMemberCard = (m) => (
    <div key={m.id} className={`glass-card hover-scale rounded-3xl overflow-hidden flex flex-col relative ${m.position === 'chef' ? 'ring-2 ring-orange-500/50' : ''}`}>
      {renderMemberAdminButtons(m)}
      {renderMemberPhoto(m, 'h-40 sm:h-48')}
      <div className="p-4 space-y-1.5">
        <span className={`text-[9px] sm:text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-full inline-block ${m.position === 'chef' ? 'bg-orange-600 text-white' : 'bg-stone-500/10 text-stone-600 border border-stone-400/30'}`}>
          {m.position === 'chef' ? 'Chef' : 'Adjoint(e)'}
        </span>
        <h5 className="font-serif text-base sm:text-lg font-bold text-stone-900 leading-tight">{m.name}</h5>
        <p className="text-xs text-stone-600">{m.role}</p>
        {m.bio && <p className="text-xs text-stone-500 leading-relaxed pt-1">{m.bio}</p>}
      </div>
    </div>
  );

  const renderNewsCard = (item) => (
<div key={item.id} className="glass-card rounded-3xl p-6 hover-scale space-y-4 relative">
      {isAdminLoggedIn && (
        <div className="absolute top-3 right-3 z-10 flex gap-2">
          <button onClick={() => openEditResource('news', item)} aria-label={`Modifier ${item.title}`} className="w-9 h-9 rounded-full bg-white/90 backdrop-blur border border-white/70 flex items-center justify-center text-orange-600 hover:bg-orange-600 hover:text-white transition duration-200"><Pencil className="w-4 h-4" /></button>
          <button onClick={() => setResourceToDelete({ type: 'news', item })} aria-label={`Supprimer ${item.title}`} className="w-9 h-9 rounded-full bg-white/90 backdrop-blur border border-white/70 flex items-center justify-center text-rose-600 hover:bg-rose-600 hover:text-white transition duration-200"><Trash className="w-4 h-4" /></button>
        </div>
      )}
      <div className={`flex justify-between items-center text-xs font-semibold ${isAdminLoggedIn ? 'pr-20' : ''}`}>
        <span className="flex flex-wrap items-center gap-2"><span className="bg-orange-500/10 text-orange-700 px-3 py-1 rounded-full border border-orange-500/20">{splitCountdown(item.date).text}</span>{splitCountdown(item.date).flag && <CountdownPill date={item.date} />}{isMembersNews(item) && <span className="inline-flex items-center gap-1 bg-stone-900 text-white px-2.5 py-1 rounded-full text-[10px] uppercase tracking-wide"><Key className="w-3 h-3 text-orange-400" /> Membres</span>}</span>
        {(() => {
          const liked = hasLiked(item.id);
          const count = likeCount(item.id);
          return (
            <button
              type="button"
              onClick={() => toggleLike(item)}
              disabled={!!pendingLikes[item.id]}
              aria-pressed={liked}
              aria-label={liked ? "Je n'aime plus" : "J'aime"}
              title={isUserAuthenticated ? (liked ? "Retirer mon J'aime" : "J'aime") : "Connectez-vous pour aimer"}
              className={`flex items-center gap-1.5 px-3 py-1 rounded-full border font-bold transition duration-200 disabled:opacity-60 ${liked ? 'bg-rose-500 text-white border-rose-500' : 'bg-white/70 text-rose-500 border-rose-200 hover:bg-rose-50'}`}
            >
              <Heart className={`w-4 h-4 ${liked ? 'fill-white' : ''}`} /> {count}
            </button>
          );
        })()}
      </div>
      <h4 className="font-serif text-xl font-bold text-stone-900">{item.title}</h4>
      <p className="text-stone-600 text-sm leading-relaxed whitespace-pre-line break-words">{renderWithLinks(item.content)}</p>
      {item.link && normalizeUrl(item.link) && (
        <a href={normalizeUrl(item.link)} target="_blank" rel="noopener noreferrer" className="hover-scale inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-orange-600 text-white text-xs font-semibold shadow-lg shadow-orange-600/30 max-w-full">
          <LinkIcon className="w-4 h-4 flex-shrink-0" />
          <span className="truncate">{item.link_label || 'Ouvrir le lien'}</span>
        </a>
      )}
    </div>
  );

  return (
    <div className="min-h-screen flex flex-col text-stone-800 font-sans antialiased selection:bg-orange-500 selection:text-white">
      <MaritimeBackground />
      
      {/* Toast Notification */}
      {toast && (
        <div
          role={toast.type === 'error' ? 'alert' : 'status'}
          aria-live={toast.type === 'error' ? 'assertive' : 'polite'}
          onClick={() => setToast(null)}
          style={{ zIndex: 9999 }}
          className={`fixed top-6 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md px-5 py-4 rounded-2xl shadow-2xl flex items-start gap-3 border-2 cursor-pointer ${toast.type === 'error' ? 'bg-rose-600 border-rose-700 text-white' : 'bg-white border-orange-200 text-stone-900'}`}
        >
          {toast.type === 'error'
            ? <AlertCircle className="text-white w-5 h-5 flex-shrink-0 mt-0.5" />
            : <CheckCircle className="text-orange-600 w-5 h-5 flex-shrink-0 mt-0.5" />}
          <span className="text-sm font-semibold leading-snug">{toast.msg}</span>
        </div>
      )}

      {/* MODALE MOT DE PASSE DÉFINI PAR L'ADMIN */}
      {resetModalMember && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={() => setResetModalMember(null)}>
          <div role="dialog" aria-modal="true" aria-labelledby="reset-title" className="glass-card w-full max-w-sm rounded-3xl p-8 space-y-5 relative" onClick={e => e.stopPropagation()}>
            <button onClick={() => setResetModalMember(null)} aria-label="Fermer" className="absolute top-5 right-5 text-stone-400 hover:text-stone-700"><X className="w-5 h-5" /></button>
            <div className="space-y-1">
              <div className="w-11 h-11 rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
                <RefreshCw className="w-5 h-5 text-orange-600" />
              </div>
              <h3 id="reset-title" className="font-serif text-xl font-bold text-stone-900 pt-2">{resetModalMember.has_password ? 'Réinitialiser le mot de passe' : 'Définir le premier mot de passe'}</h3>
              <p className="text-xs text-stone-500">Mot de passe provisoire pour <strong>{resetModalMember.name}</strong> ({resetModalMember.matricule}), {MIN_PASSWORD_LENGTH} caractères minimum. Transmettez-le-lui en privé : il pourra le changer depuis son espace.</p>
            </div>
            <input
              type="password"
              autoFocus
              autoComplete="new-password"
              aria-label="Mot de passe provisoire"
              placeholder="Mot de passe provisoire"
              value={newPinResetInput}
              onChange={(e) => setNewPinResetInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && handleAdminResetPin()}
              className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
            />
            <button
              onClick={handleAdminResetPin}
              disabled={isResettingPin}
              className="hover-scale w-full py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 disabled:opacity-60"
            >
              {isResettingPin ? "Enregistrement..." : "Enregistrer le mot de passe"}
            </button>
          </div>
        </div>
      )}

      {/* MODALE CRÉATION D'UN COMPTE MEMBRE (ADMIN) */}
      {showAddAccount && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={closeAddAccount}>
          <div role="dialog" aria-modal="true" aria-labelledby="add-account-title" className="glass-card w-full max-w-sm rounded-3xl p-8 space-y-5 relative" onClick={e => e.stopPropagation()}>
            <button onClick={closeAddAccount} aria-label="Fermer" className="absolute top-5 right-5 text-stone-400 hover:text-stone-700"><X className="w-5 h-5" /></button>
            <div className="space-y-1">
              <div className="w-11 h-11 rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
                <UserCheck className="w-5 h-5 text-orange-600" />
              </div>
              <h3 id="add-account-title" className="font-serif text-xl font-bold text-stone-900 pt-2">Créer un compte membre</h3>
              <p className="text-xs text-stone-500">Le membre se connectera avec ce matricule. Le mot de passe provisoire peut aussi être défini plus tard.</p>
            </div>
            <div className="space-y-3">
              <input autoFocus aria-label="Matricule" placeholder="Matricule (ex. ARSTM-CGE-0056) *" value={newAccountForm.matricule} onChange={e => setNewAccountForm(f => ({ ...f, matricule: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <input aria-label="Nom et prénoms" placeholder="Nom et prénoms *" value={newAccountForm.name} onChange={e => setNewAccountForm(f => ({ ...f, name: e.target.value }))} className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <input type="password" autoComplete="new-password" aria-label="Mot de passe provisoire" placeholder={`Mot de passe provisoire (${MIN_PASSWORD_LENGTH} caractères min., facultatif)`} value={newAccountForm.password} onChange={e => setNewAccountForm(f => ({ ...f, password: e.target.value }))} onKeyDown={(e) => e.key === 'Enter' && handleAddAccount()} className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
            </div>
            <button onClick={handleAddAccount} disabled={isAddingAccount} className="hover-scale w-full py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 disabled:opacity-60">
              {isAddingAccount ? "Création..." : "Créer le compte"}
            </button>
          </div>
        </div>
      )}

      {/* MODALE CHANGEMENT DE MOT DE PASSE (PERSONNE CONNECTÉE) */}
      {showChangePwd && currentUser && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={closeChangePwd}>
          <div role="dialog" aria-modal="true" aria-labelledby="pwd-title" className="glass-card w-full max-w-sm rounded-3xl p-8 space-y-5 relative" onClick={e => e.stopPropagation()}>
            <button onClick={closeChangePwd} className="absolute top-5 right-5 text-stone-400 hover:text-stone-700" aria-label="Fermer"><X className="w-5 h-5" /></button>
            <div className="space-y-1">
              <div className="w-11 h-11 rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
                <Key className="w-5 h-5 text-orange-600" />
              </div>
              <h3 id="pwd-title" className="font-serif text-xl font-bold text-stone-900 pt-2">Changer mon mot de passe</h3>
              <p className="text-xs text-stone-500">Saisissez votre mot de passe actuel, puis le nouveau ({MIN_PASSWORD_LENGTH} caractères minimum).</p>
            </div>
            <div className="space-y-3">
              <input
                type="password"
                autoFocus
                autoComplete="current-password"
                aria-label="Mot de passe actuel"
                placeholder="Mot de passe actuel"
                value={pwdForm.current}
                onChange={(e) => { setPwdForm(f => ({ ...f, current: e.target.value })); setPwdError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleChangeOwnPassword()}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
              <input
                type="password"
                autoComplete="new-password"
                aria-label="Nouveau mot de passe"
                placeholder="Nouveau mot de passe"
                value={pwdForm.next}
                onChange={(e) => { setPwdForm(f => ({ ...f, next: e.target.value })); setPwdError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleChangeOwnPassword()}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
              <input
                type="password"
                autoComplete="new-password"
                aria-label="Confirmer le nouveau mot de passe"
                placeholder="Confirmer le nouveau mot de passe"
                value={pwdForm.confirm}
                onChange={(e) => { setPwdForm(f => ({ ...f, confirm: e.target.value })); setPwdError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleChangeOwnPassword()}
                className="w-full px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>
            {pwdError && (
              <div role="alert" className="flex items-start gap-2 px-4 py-3 rounded-2xl bg-rose-50 border border-rose-300 text-rose-700">
                <AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                <span className="text-xs font-semibold leading-relaxed">{pwdError}</span>
              </div>
            )}
            <button
              onClick={handleChangeOwnPassword}
              disabled={isChangingPwd}
              className="hover-scale w-full py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30 disabled:opacity-60"
            >
              {isChangingPwd ? "Enregistrement..." : "Enregistrer le nouveau mot de passe"}
            </button>
          </div>
        </div>
      )}

      {/* MODALE CANDIDATURE (offre d'emploi / stage) */}
      <iframe name="cge_apply_iframe" title="Envoi de candidature" className="hidden" onLoad={handleApplyIframeLoad} />
      {cgeApplyJob && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={closeCgeApply}>
          <div role="dialog" aria-modal="true" aria-labelledby="cge-apply-title" className="glass-card w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-3xl p-6 sm:p-7 space-y-5 relative" onClick={e => e.stopPropagation()}>
            {!cgeSending && <button onClick={closeCgeApply} className="absolute top-5 right-5 text-stone-400 hover:text-stone-700" aria-label="Fermer"><X className="w-5 h-5" /></button>}
            <div className="pr-8">
              <p className="text-[11px] font-bold uppercase tracking-widest text-orange-600">Postuler</p>
              <h3 id="cge-apply-title" className="font-serif text-xl font-bold text-stone-900 leading-tight">{cgeApplyJob.title}</h3>
              <p className="text-xs text-stone-500">{cgeApplyJob.company}{cgeApplyJob.type ? ` — ${cgeApplyJob.type}` : ''}</p>
            </div>
            {myCv ? (
              <div className="flex items-center gap-2 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 px-4 py-3 text-sm text-emerald-800">
                <CheckCircle className="w-4 h-4 flex-shrink-0" /> <span className="min-w-0 break-words">CV joint : <strong>{myCv.filename}</strong></span>
              </div>

              <input value={newMemberForm.name} onChange={e => setNewMemberForm(f => ({...f,name:e.target.value}))} aria-label="Nom complet" placeholder="Nom complet *" className="px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <input value={newMemberForm.role} onChange={e => setNewMemberForm(f => ({...f,role:e.target.value}))} aria-label="Poste affiché" placeholder="Poste affiché (ex. Trésorière Générale) *" className="px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
              <select value={newMemberForm.department} onChange={e => setNewMemberForm(f => ({...f,department:e.target.value}))} aria-label="Département" className="px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">

              <input type="password" autoComplete="new-password" value={newMemberForm.pin} onChange={e => setNewMemberForm(f => ({...f,pin:e.target.value}))} aria-label="Mot de passe" placeholder={editingMemberId !== null ? 'Nouveau mot de passe (facultatif)' : 'Mot de passe (facultatif)'} className="px-4 py-3 rounded-2xl bg-white/70 border border-stone-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />

          </div>
        </div>
      )}
      {/* MODALE GENERIQUE AJOUT / MODIFICATION */}
      {resourceModal.type && (() => {
        const config = RESOURCE_CONFIGS[resourceModal.type];

        const setField = (key, value) => setResourceForm(f => ({ ...f, [key]: value }));
        const renderField = (field) => {
          const id = `field-${field.key}`;
          const value = resourceForm[field.key] || '';
          if (field.type === 'textarea') return <textarea id={id} rows="4" value={value} onChange={e => setField(field.key, e.target.value)} className={inputClass} />;
          if (field.type === 'select') return (
            <select id={id} value={value || optValue(field.options[0])} onChange={e => setField(field.key, e.target.value)} className={inputClass}>
              {field.options.map(o => { const v = typeof o === 'string' ? o : o.value; const l = typeof o === 'string' ? o : o.label; return <option key={v} value={v}>{l}</option>; })}
            </select>
          );
          if (field.type === 'image') return (
            <div className="space-y-2">
              <input id={id} type="file" accept="image/*" onChange={handleResourceImageUpload} className="w-full text-xs" />
              {resourcePhotoStatus && <p role="status" className="text-xs font-semibold text-emerald-700">{resourcePhotoStatus}</p>}
              {value && <img src={value} alt="Aperçu" className="w-full h-44 object-cover rounded-2xl" />}
            </div>
          );
          const placeholder = field.type === 'url' ? 'https://' : field.type === 'apply' ? 'https://... ou recrutement@entreprise.com' : undefined;
          return <input id={id} type={field.type === 'url' ? 'url' : 'text'} inputMode={field.type === 'url' ? 'url' : undefined} placeholder={placeholder} value={value} onChange={e => setField(field.key, e.target.value)} className={inputClass} />;

          <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm p-4" onClick={closeResourceModal}>

                    <label key={field.key} htmlFor="field-countdown" className="flex items-start gap-3 rounded-2xl bg-orange-500/10 border border-orange-500/20 p-4 cursor-pointer">

                        <strong className="text-stone-900">Afficher un compte à rebours ?</strong><br />

                      </span>
                    </label>
                  );
                }
                return (
                  <div key={field.key} className="space-y-1.5">
                    <label htmlFor={`field-${field.key}`} className="text-xs font-semibold text-stone-600">{field.label}{field.required ? ' *' : ''}</label>
                    {renderField(field)}
                  </div>
                );
              })}</div>

            </div>
          </div>
        );

              <div>
                <h2 className="font-serif text-3xl font-bold text-stone-900">Contact</h2>
                <p className="text-stone-600 text-sm mt-1">Secrétariat de la Conférence des Grandes Écoles — ARSTM, Abidjan, Côte d'Ivoire.</p>
              </div>
              {canEdit('contacts') && (
                <button onClick={() => openAddResource('contacts')} className="hover-scale flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-orange-600 text-white text-xs font-semibold shadow-lg shadow-orange-600/30">
                  <Plus className="w-4 h-4" /> Ajouter un contact
                </button>
              )}
            </div>
            {contacts.length === 0 ? (
              <p className="text-stone-500 text-sm">Aucun contact pour le moment.</p>
            ) : (
              <ul className="divide-y divide-stone-200/70">
                {contacts.map(c => {
                  const href = contactHref(c.value);
                  return (
                    <li key={c.id} className="py-3 flex items-center justify-between gap-4">
                      <div className="min-w-0">
                        <p className="text-[11px] font-bold uppercase tracking-wide text-orange-600">{c.label}</p>
                        {href
                          ? <a href={href} target={href.startsWith('http') ? '_blank' : undefined} rel="noopener noreferrer" className="text-stone-900 font-semibold text-sm break-words hover:text-orange-600 underline-offset-2 hover:underline">{c.value}</a>
                          : <p className="text-stone-900 font-semibold text-sm break-words">{c.value}</p>}
                      </div>
                      {canEdit('contacts') && (
                        <div className="flex gap-2 flex-shrink-0">
                          <button onClick={() => openEditResource('contacts', c)} aria-label={`Modifier ${c.label}`} className="w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-orange-600 hover:bg-orange-600 hover:text-white transition duration-200"><Pencil className="w-4 h-4" /></button>
                          <button onClick={() => setResourceToDelete({ type: 'contacts', item: c })} aria-label={`Supprimer ${c.label}`} className="w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-rose-600 hover:bg-rose-600 hover:text-white transition duration-200"><Trash className="w-4 h-4" /></button>
                        </div>
                      )}
                    </li>
                  );
                })}
              </ul>
            )}
            <div className="pt-6 border-t border-stone-200/70 text-center space-y-3">
              <p className="text-[11px] font-bold uppercase tracking-widest text-orange-600">Notre partenaire</p>
              <div className="mx-auto max-w-md rounded-3xl bg-white/70 border border-orange-500/20 shadow-lg shadow-orange-600/10 p-5">
                <img src={LOGO_SPONSOR_SRC} alt="Fondation Benianh International — partenaire du Club CGE ARSTM" className="mx-auto w-full max-w-[18rem] h-auto object-contain" draggable="false" />
              </div>
              <p className="text-xs text-stone-500">Fondation Benianh International, partenaire du Club CGE ARSTM</p>
            </div>
          </div>
        )}

        {/* ESPACE MEMBRE VIEW */}
        {activeTab === 'espace-membre' && currentUser && (
          <div className="space-y-6">
          <div className="max-w-xl mx-auto glass-card p-8 rounded-3xl text-center space-y-6">
            <div className="w-16 h-16 mx-auto rounded-2xl bg-orange-500/15 border border-orange-500/25 flex items-center justify-center">
              <UserCheck className="w-8 h-8 text-orange-600" />
            </div>
            <div>
              <h2 className="font-serif text-2xl font-bold text-stone-900">
                {isAdminLoggedIn || isSecretariatLoggedIn ? currentUser.name : `Bonjour, ${currentUser.name}`}
              </h2>
              {!isAdminLoggedIn && !isSecretariatLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">{[currentUser.memberRole, currentUser.matricule].filter(Boolean).join(' — ')}</p>
              )}
              {isSecretariatLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">Accès secrétariat ({currentUser.login}) — modification de Contact, Médiathèque et Registre</p>
              )}
              {isAdminLoggedIn && (
                <p className="text-stone-500 text-sm mt-1">Accès administrateur ({currentUser.login})</p>
              )}
            </div>
            <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
              <button onClick={() => setShowChangePwd(true)} className="hover-scale inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-orange-600 text-white font-semibold shadow-lg shadow-orange-600/30">
                <Key className="w-4 h-4" /> Changer mon mot de passe
              </button>
              <button onClick={handleLogout} className="hover-scale inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-stone-900 text-white font-semibold">
                <LogOut className="w-4 h-4" /> Se déconnecter
              </button>
            </div>
          </div>
          {isMemberLoggedIn && (
            <div className="max-w-xl mx-auto space-y-6">
              <div className="glass-card p-6 sm:p-8 rounded-3xl space-y-4">
                <div>
                  <p className="text-[11px] font-bold uppercase tracking-widest text-orange-600">Mon espace personnel</p>
                  <h3 className="font-serif text-xl font-bold text-stone-900">Mon CV</h3>
                  <p className="text-sm text-stone-600">Déposez votre CV en PDF (2 Mo maximum). Il sera joint automatiquement à vos candidatures.</p>
                </div>
                {myCv ? (
                  <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-white/60 border border-white/70 px-4 py-3">
                    <div className="min-w-0">
                      <p className="text-sm font-semibold text-stone-900 break-words">{myCv.filename}</p>
                      <p className="text-xs text-stone-500">Ajouté le {fmtDate(myCv.updated_at)} · {(myCv.size_bytes / 1048576).toFixed(1)} Mo</p>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={viewMyCv} className="px-4 py-2 rounded-xl bg-white/80 border border-stone-200 text-xs font-semibold text-stone-700 hover:text-orange-600">Voir</button>
                      <button onClick={removeCv} className="px-4 py-2 rounded-xl bg-white/80 border border-stone-200 text-xs font-semibold text-rose-600 hover:bg-rose-600 hover:text-white">Supprimer</button>
                    </div>
                  </div>
                ) : (
                  <p className="text-sm text-stone-500">Aucun CV pour le moment.</p>
                )}
                <label className="hover-scale inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-orange-600 text-white text-sm font-semibold shadow-lg shadow-orange-600/30 cursor-pointer">
                  <input type="file" accept="application/pdf,.pdf" className="sr-only" disabled={cvBusy} onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) uploadCv(f); }} />
                  {cvBusy ? 'Envoi en cours…' : myCv ? 'Remplacer mon CV' : 'Ajouter mon CV'}
                </label>
              </div>
              <div className="glass-card p-6 sm:p-8 rounded-3xl space-y-3">
                <h3 className="font-serif text-xl font-bold text-stone-900">Mes candidatures</h3>
                {applications.length === 0 ? (
                  <p className="text-sm text-stone-500">Vous n'avez pas encore postulé. Rendez-vous dans « Emplois & Stages ».</p>
                ) : (
                  <ul className="divide-y divide-stone-200/70">
                    {applications.map(a => (
                      <li key={a.id} className="py-3 flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <p className="text-sm font-semibold text-stone-900 break-words">{a.job_title}{a.job_company ? ` — ${a.job_company}` : ''}</p>
                          <p className="text-xs text-stone-500">Envoyée le {fmtDate(a.created_at)}</p>
                        </div>
                        <span className={`text-[11px] font-bold px-3 py-1 rounded-full border whitespace-nowrap ${a.status === 'sent' ? 'text-emerald-700 bg-emerald-500/10 border-emerald-500/20' : 'text-orange-700 bg-orange-500/10 border-orange-500/25'}`}>
                          {a.status === 'sent' ? "Transmise à l'entreprise" : 'Reçue par le secrétariat'}
                        </span>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            </div>
          )}
          </div>
        )}

      </main>

      {/* PIED DE PAGE : CRÉATEURS DU SITE (permanent, discret, accueil uniquement) */}
      <footer className="w-full px-4 pt-0 pb-2 text-center">
        {activeTab !== 'accueil' && activeTab !== 'contact' && (
          <div className="flex items-center justify-center gap-2 pb-3">
            <span className="text-[11px] text-stone-500">En partenariat avec</span>
            <img src={LOGO_SPONSOR_SRC} alt="Fondation Benianh International" className="h-9 w-auto object-contain" draggable="false" />
          </div>
        )}
        {activeTab === 'accueil' && (
          <p className="text-[9px] leading-snug text-stone-400/50">
            © {new Date().getFullYear()} CGE ARSTM · Réalisé par {SITE_CREATORS.map(c => `${c.name} (${c.section}, ${c.promo})`).join(' et ')}
          </p>
        )}
      </footer>

      {/* BARRE EN BAS : APPLE LIQUID GLASS DOCK */}
      <div className="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
        <nav
          ref={navRef}
          aria-label="Navigation principale"
          onMouseLeave={() => setHoveredTab(null)}
          className="pointer-events-auto relative glass-dock p-2 rounded-full flex items-center gap-1 max-w-full overflow-x-auto no-scrollbar"
        >
          <div
            className="absolute top-2 bottom-2 liquid-pill rounded-full pointer-events-none"
            style={{
              left: `${pillStyle.left}px`,
              width: `${pillStyle.width}px`,
              opacity: pillStyle.opacity,
            }}
          />

          {navItems.map(item => {
            const Icon = item.icon;
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                data-tab={item.id}
                aria-label={item.label}
                aria-current={isActive ? 'page' : undefined}
                onClick={() => { setActiveTab(item.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                onMouseEnter={() => setHoveredTab(item.id)}
                className={`relative z-10 flex items-center gap-2 px-4 py-3 rounded-full text-xs font-bold transition-transform duration-300 transform hover:scale-110 active:scale-95 whitespace-nowrap ${
                  isActive || hoveredTab === item.id ? 'text-white' : 'text-stone-700 hover:text-stone-950'
                }`}
              >
                <Icon className="w-4 h-4" />
                <span className="hidden sm:inline">{item.label}</span>
              </button>
            );
          })}
        </nav>
      </div>

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
